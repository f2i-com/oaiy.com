[workspace]
resolver = "2"
# Vendored cudarc (patched in [patch.crates-io] below) is not a workspace member.
# The two desktop apps (bot.computer's in app/, the previous OAIY Desktop in
# platform/) keep their own lockfiles and build on their own for now.
exclude = ["crates/cudarc", "app/src-tauri", "platform/desktop/src-tauri"]
members = [
    "crates/oaiy-media",
    # Realtime text to speech (Qwen3-TTS on Candle, streaming, voice cloning);
    # oaiy-media shares its speech layers. Like oaiy-media, not a default member.
    "crates/oaiy-tts",
    "crates/oaiy-engine",
    "crates/oaiy-llm-cli",
    # DeepSeek-V4.1 support (docs/DEEPSEEK_V41.md); std-only like the core.
    "crates/dsv41",
    # Image decoding for the vision models (PNG, JPEG, Pillow-exact resize);
    # std-only like the core.
    "crates/oaiy-image",
    # Its CUDA path (and the hybrid CPU/GPU decode). Like ggml-rs-cuda: a
    # member, not a default member (needs a CUDA toolchain); holds the
    # reviewed unsafe (kernel launches, pinned mappings, AVX-512 dispatch).
    "crates/dsv41-cuda",
    # The OpenAI-compatible server for it (needs CUDA too, so not a default
    # member either).
    "crates/oaiy-llm-server",
    # The portable host: supervises oaiy-llm-server and oaiy-media, serves the
    # control UI and the configurable API gateway. std-only, so a default member.
    "crates/oaiy-studio",
    # The studio as a Windows notification-area app (windows-sys; the only
    # unsafe is its Win32 calls, in src/tray.rs).
    "crates/oaiy-studio-tray",
    # Vendored GGUF compute subsystem (see crates/VENDORED.md). These keep
    # their own identity and external deps; the std-only rule below does
    # not apply to them.
    "crates/gguf",
    "crates/ggml-quants",
    "crates/ggml-rs",
    "crates/tokenizer",
    "crates/llama-rs",
    # Vendored CUDA backend (see crates/VENDORED.md). A member so its tests
    # run under `--workspace`, but kept out of `default-members`: building it
    # needs a CUDA toolchain (cudarc dynamic-linking), so the default build
    # stays CPU-only. Opt in with `cargo build -p oaiy-llm-cli --features cuda`.
    "crates/ggml-rs-cuda",
    # WebGPU backend (VENDORED-LOCAL addition beside ggml-rs-cuda): quantized
    # matmuls on any wgpu adapter for machines without CUDA. A member, not a
    # default member: wgpu adds minutes to every default build.
    "crates/ggml-rs-wgpu",
    # The resident speech server (Parakeet speech-to-text on Candle). Like
    # oaiy-media a member, not a default member: Candle is a long build, and
    # its GPU build needs a CUDA toolchain (`--features cuda`).
    "crates/oaiy-voice",
    # The vault's key material (docs: design/vault.final.md, work packages
    # V-01 and V-02): the cryptographic primitives and the named-secret
    # keystore. Libraries with external dependencies (RustCrypto, windows-sys),
    # so members and not default members, like oaiy-media: nothing links them
    # yet, and `cargo test -p oaiy-crypto -p oaiy-keystore` runs them.
    "crates/oaiy-crypto",
    "crates/oaiy-keystore",
]
default-members = [
    "crates/oaiy-engine",
    "crates/oaiy-llm-cli",
    "crates/dsv41",
    "crates/oaiy-image",
    "crates/oaiy-studio",
    "crates/oaiy-studio-tray",
    "crates/gguf",
    "crates/ggml-quants",
    "crates/ggml-rs",
    "crates/tokenizer",
    "crates/llama-rs",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

# Hard rule for oaiy-engine, oaiy-image, oaiy-studio and dsv41: std-only, no external crates.
# Do not add a [workspace.dependencies] table.
# Exception: the vendored GGUF subsystem members (crates/gguf,
# ggml-quants, ggml-rs, tokenizer, llama-rs, ggml-rs-cuda — see
# crates/VENDORED.md) carry their own explicit external dependencies and
# do not inherit from this workspace.

[profile.dev.package.argon2]
# oaiy-crypto's tests run Argon2id at the design's 64 MiB floor (a hundred milliseconds when optimised, many seconds without
# it): the dependency alone is optimised in test and dev builds, and nothing of ours is.
opt-level = 3

# A build with no optimisation and no debug assertions, which no other profile is: the dead-stack probe of oaiy-crypto runs in it
# (`cargo test --profile vault-probe -p oaiy-crypto --test zeroize_stack`), because the frames of a computation are largest there and "debug" and "release" do not cover it (review low 1).
[profile.vault-probe]
inherits = "release"
opt-level = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.vault-probe.package.argon2]
opt-level = 3

[profile.release]
# rustc 1.92.0 (stable MSVC) crashes with STATUS_ACCESS_VIOLATION compiling
# ggml-rs-cuda's tests/cpu_vs_cuda.rs at the default codegen-units=16;
# a single codegen unit avoids it (and matches the vendored llm workspace).
codegen-units = 1

# VENDORED-LOCAL: cudarc 0.19.8 with one fix (crates/cudarc, see crates/VENDORED.md): a
# device buffer freed on a thread without its context current was never released.
[patch.crates-io]
cudarc = { path = "crates/cudarc" }
