[package]
name = "nrob-server"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenAI-compatible HTTP server for DeepSeek-V4.1-Flash on nrob"

[[bin]]
name = "nrob-server"
path = "src/main.rs"

# std-only apart from the workspace crates (dsv41-cuda brings CUDA).
[dependencies]
nrob = { path = "../nrob" }
dsv41 = { path = "../dsv41" }
dsv41-cuda = { path = "../dsv41-cuda" }
# VENDORED-LOCAL: GLM-5.3-Flash is served through llama-rs rather than dsv41-cuda,
# so a second engine sits beside the DeepSeek one (see src/glm.rs). The CUDA
# feature is not optional here: this server has never built without CUDA, because
# dsv41-cuda is unconditional above.
llama-rs = { path = "../llama-rs", features = ["cuda"] }
tokenizer = { path = "../tokenizer" }
gguf = { path = "../gguf" }
ggml-rs = { path = "../ggml-rs" }
ggml-rs-cuda = { path = "../ggml-rs-cuda" }
