[package]
name        = "ggml-rs-cuda"
version     = "0.0.1"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "CUDA backend for ggml-rs (NVRTC-compiled F32 kernels)."

[dependencies]
ggml-rs     = { path = "../ggml-rs", version = "0.0.1" }
ggml-quants = { path = "../ggml-quants", version = "0.0.1" }
# `dynamic-linking` (compile-time link to nvcuda/nvrtc/cublas) chosen so we
# unify with `candle-core`'s cudarc choice when both crates land in one
# downstream binary (F2I desktop runs plugin-diffusion via candle AND
# plugin-llm via this crate — Cargo's feature unification panics when one
# tree pulls `dynamic-loading` and the other pulls `dynamic-linking`).
cudarc      = { version = "0.19", features = ["cuda-version-from-build-system", "driver", "nvrtc", "cublas", "dynamic-linking"], default-features = false }
thiserror   = "1.0"

[dev-dependencies]
half = { version = "2.4", features = ["bytemuck", "num-traits"] }
