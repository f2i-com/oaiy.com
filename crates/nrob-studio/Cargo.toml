[package]
name = "nrob-studio"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Portable host for nrob: runs the LLM server and the media worker, exposes configurable OpenAI-style endpoints, and serves a local control UI"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nrob-studio"
path = "src/main.rs"

# std-only like the core: it supervises nrob-server and nrob-diffusion as
# subprocesses, so it builds (and runs its UI) on machines without CUDA.
[dependencies]
nrob = { path = "../nrob" }
