[package]
name = "oaiy-llm-cli"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "oaiy-llm command line: run GGUF models, experts streamed NVMe -> RAM -> GPU"

[[bin]]
name = "oaiy-llm"
path = "src/main.rs"

# The oaiy-llm core plus the workspace's own GGUF stack (crates/VENDORED.md),
# which carries its own dependencies.
[dependencies]
oaiy-engine = { path = "../oaiy-engine" }
llama-rs = { path = "../llama-rs" }
ggml-rs = { path = "../ggml-rs" }
gguf = { path = "../gguf" }
tokenizer = { path = "../tokenizer" }
# WebGPU backend for `oaiy-llm run --webgpu`, behind the `webgpu` feature: any
# D3D12/Vulkan/Metal GPU.
ggml-rs-wgpu = { path = "../ggml-rs-wgpu", optional = true }

[features]
default = ["webgpu"]
# GPU inference: `oaiy-llm run model.gguf --webgpu` (`--no-default-features` builds
# the CPU-only tool).
webgpu = ["dep:ggml-rs-wgpu"]
