[package]
name = "oaiy-tts"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OAIY's realtime text to speech: Qwen3-TTS (12 Hz) on the GPU, streaming, in a voice cloned from a short clip"

[dependencies]
oaiy-engine = { path = "../oaiy-engine" }
dsv41 = { path = "../dsv41" }
candle-core = "0.11.0"
candle-nn = "0.11.0"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[features]
default = []
