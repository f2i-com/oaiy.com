[package]
name = "nrob-diffusion"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust Qwen Image and LTX video inference worker for NROB"

[dependencies]
nrob = { path = "../nrob" }
dsv41 = { path = "../dsv41" }
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-flash-attn = { version = "0.11.0", optional = true }
regex = "1"
half = "2"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Mesh simplification for 3D models (meshoptimizer, MIT).
meshopt = "0.6"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
flash-attn = ["cuda", "dep:candle-flash-attn"]
