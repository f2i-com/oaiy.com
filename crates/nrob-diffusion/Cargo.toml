[package]
name = "nrob-diffusion"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust Qwen Image 2.1 inference worker for NROB"

[dependencies]
nrob = { path = "../nrob" }
dsv41 = { path = "../dsv41" }
candle-core = "0.11.0"
candle-nn = "0.11.0"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
