[package]
name        = "ggml-rs-wgpu"
version     = "0.0.1"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "WebGPU backend for ggml-rs: quantized matmuls in WGSL on any wgpu adapter, the rest on the CPU backend."

[dependencies]
ggml-rs     = { path = "../ggml-rs", version = "0.0.1" }
ggml-quants = { path = "../ggml-quants", version = "0.0.1" }
wgpu        = "30"
pollster    = "0.4"
# f16 rounding of EXL3 projections' activations, as exllamav3 rounds them.
half        = { version = "2.4" }
rayon       = "1.10"
# a chain's reads copied out as bytes
bytemuck    = "1.16"

[dev-dependencies]
