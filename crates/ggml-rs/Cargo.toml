[package]
name        = "ggml-rs"
version     = "0.0.1"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Tensor + CPU ops core; pluggable Backend trait for CPU/GPU."

[dependencies]
ggml-quants = { path = "../ggml-quants", version = "0.0.1" }
bytemuck    = { version = "1.16", features = ["derive"] }
half        = { version = "2.4", features = ["bytemuck", "num-traits"] }
num-traits  = "0.2"
rayon       = "1.10"
thiserror   = "1.0"
