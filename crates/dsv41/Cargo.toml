[package]
name = "dsv41"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DeepSeek-V4.1 for OAIY: in-place safetensors expert store, FP4/FP8 formats, forward pass"

# std-only like the engine core (CONVENTIONS.md): the dependencies are OAIY
# itself, for WeightStore / Ecache / json / Error, and oaiy-image for vision.
[dependencies]
oaiy-engine = { path = "../oaiy-engine" }
oaiy-image = { path = "../oaiy-image" }
