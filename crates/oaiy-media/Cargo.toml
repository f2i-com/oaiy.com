[package]
name = "oaiy-media"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust Qwen Image and LTX video inference worker for OAIY"

[dependencies]
oaiy-engine = { path = "../oaiy-engine" }
oaiy-image = { path = "../oaiy-image" }
dsv41 = { path = "../dsv41" }
# Qwen3-TTS's layers, codec and voice encoders (shared with the realtime engine).
oaiy-tts = { path = "../oaiy-tts" }
candle-core = "0.11.0"
candle-nn = "0.11.0"
regex = "1"
half = "2"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Mesh simplification for 3D models (meshoptimizer, MIT).
meshopt = "0.6"
# The WebGPU chain (Qwen Image's transformer on any GPU wgpu reaches: Vulkan, Metal, Direct3D 12).
ggml-rs = { path = "../ggml-rs", optional = true }
ggml-rs-wgpu = { path = "../ggml-rs-wgpu", optional = true }
ggml-quants = { path = "../ggml-quants", optional = true }

[features]
default = ["webgpu"]
webgpu = ["dep:ggml-rs", "dep:ggml-rs-wgpu", "dep:ggml-quants"]

# On a Mac its WebGPU also takes the TinyGPU adapter (a card in a Thunderbolt enclosure, through tinygrad), where
# OAIY_WEBGPU_ADAPTER names it (docs/TINYGPU.md), as the LLM engine's does.
[target.'cfg(target_os = "macos")'.dependencies]
ggml-rs-wgpu = { path = "../ggml-rs-wgpu", optional = true, features = ["tinygpu"] }
