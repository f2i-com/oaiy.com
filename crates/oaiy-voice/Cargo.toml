[package]
name = "oaiy-voice"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OAIY's resident speech server: Parakeet speech-to-text on Candle, GPU first"

[dependencies]
oaiy-engine = { path = "../oaiy-engine" }
# Its std-only safetensors index (positioned reads, no mmap).
dsv41 = { path = "../dsv41" }
candle-core = "0.11.0"
candle-nn = "0.11.0"
half = "2"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
