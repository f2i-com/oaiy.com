[package]
name = "oaiy-voice"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OAIY's resident speech server: Parakeet speech-to-text and Qwen3-TTS text-to-speech on Candle, GPU first"

[dependencies]
oaiy-engine = { path = "../oaiy-engine" }
# Its std-only safetensors index (positioned reads, no mmap).
dsv41 = { path = "../dsv41" }
candle-core = "0.11.0"
candle-nn = "0.11.0"
half = "2"
# Text to speech: Qwen3-TTS, streaming, in a voice from a clip. Its engine on a GPU is oaiy-media's, on WebGPU
# (tts::realtime: the talker and the codec's decoder there); oaiy-tts has the voices, the audio and the CPU's encoders.
oaiy-tts = { path = "../oaiy-tts" }
oaiy-media = { path = "../oaiy-media" }

[features]
default = []
