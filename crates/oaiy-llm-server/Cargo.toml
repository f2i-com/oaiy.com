[package]
name = "oaiy-llm-server"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "OAIY's language models (GGUF and DeepSeek-V4.1) behind an OpenAI-compatible HTTP API"

[[bin]]
name = "oaiy-llm-server"
path = "src/main.rs"

# The same server under the name its WebGPU build had while a CUDA build stood
# beside it: the studio's configuration, the desktop's staging and the release
# workflow still ask for it by this name.
[[bin]]
name = "oaiy-llm-server-webgpu"
path = "src/webgpu_main.rs"
required-features = ["webgpu"]

[features]
default = ["webgpu"]
# Every model's kernels on any GPU wgpu reaches (see crates/ggml-rs-wgpu); without it
# (`--no-default-features`) the server runs GGUF models on the CPU.
webgpu = ["dep:ggml-rs-wgpu"]
# The WebGPU engine also on an NVIDIA card a Mac reaches only through tinygrad's TinyGPU (OAIY_WEBGPU_ADAPTER=tinygpu;
# docs/TINYGPU.md).
tinygpu = ["webgpu", "ggml-rs-wgpu/tinygpu"]

# std-only apart from the workspace crates.
[dependencies]
oaiy-engine = { path = "../oaiy-engine" }
oaiy-image = { path = "../oaiy-image" }
# The GGUF stack: the file, the quant kernels, the CPU backend and its chain, the tokenizers (src/llm runs the models
# on them; oaiy-media shares them).
tokenizer = { path = "../tokenizer" }
gguf = { path = "../gguf" }
ggml-quants = { path = "../ggml-quants" }
ggml-rs = { path = "../ggml-rs" }
rayon = "1.10"
half = { version = "2.4", features = ["bytemuck", "num-traits"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
thiserror = "1.0"
ggml-rs-wgpu = { path = "../ggml-rs-wgpu", optional = true }

# On a Mac the WebGPU engine also takes the TinyGPU adapter (`tinygpu` above): a card in a Thunderbolt enclosure, held
# through tinygrad, which OAIY's eGPU launcher gives it (docs/TINYGPU.md). Every Mac build of the engine has it; it is
# used only where OAIY_WEBGPU_ADAPTER names it.
[target.'cfg(target_os = "macos")'.dependencies]
ggml-rs-wgpu = { path = "../ggml-rs-wgpu", optional = true, features = ["tinygpu"] }
