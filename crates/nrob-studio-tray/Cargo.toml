[package]
name = "nrob-studio-tray"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NROB Studio as a Windows notification-area app: runs in the background, opens the UI on a click"

[[bin]]
name = "nrob-studio-tray"
path = "src/main.rs"

# Not std-only: the notification-area icon is Win32 UI, which std does not
# cover. windows-sys is bindings only (no runtime), and all its unsafe calls sit
# in src/tray.rs. The studio itself (nrob-studio) stays std-only.
[dependencies]
nrob = { path = "../nrob" }
nrob-studio = { path = "../nrob-studio" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
