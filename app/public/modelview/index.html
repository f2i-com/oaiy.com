<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D model preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe2e7; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: #3a4150; text-align: center; pointer-events: none; }
  #status.error { color: #a4262c; }
  #hint { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 4px 10px; border-radius: 11px; background: rgba(255, 255, 255, 0.8); color: #3a4150; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="status">Loading…</div>
<div id="hint" hidden>Drag to turn · right-drag to move · scroll to zoom</div>
<!-- bot.computer's 3D model viewer with three.js: built by scripts/modelview/build.mjs. -->
<script src="./model-viewer.js"></script>
</body>
</html>
