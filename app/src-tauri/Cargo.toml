[package]
name = "bot-computer"
version = "0.1.0"
description = "bot.computer: a coding agent in a desktop window"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "bot_computer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
percent-encoding = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
