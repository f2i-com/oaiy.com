# Automatic CI is temporarily paused (cost control, 2026-09-12); run these
# checks manually from the Actions tab. Restore push/pull_request triggers
# when automatic checks are explicitly re-enabled.
#
# This workflow is ALSO the reusable verification gate (`workflow_call`) that
# release.yml runs at the EXACT tagged revision before anything is published
# (ecosystem review OAI-01 / ECO-01): the web app's test chain, the CLI's
# complete test script and typecheck, the desktop app's Vitest suite, and the
# native Rust tests in both the headless (no default features) and the
# shipping GUI feature configurations, each on the platform it ships on, and the two
# crates that hold the vault's keys (oaiy-crypto and oaiy-keystore: the vault-linux and
# vault-windows lanes, which run format, clippy, the tests as a product is built and
# with the test-only features, the keystore's tests in a release build (the unsafe keyfile
# is refused there), the memory probes in three build configurations, and a
# dependency audit of those two crates).
# A later commit can never inherit an earlier run's status: the caller
# passes the revision it is about to build, and every lane checks it out.
#
# The ZIPP engines are not committed. OAIY follows zipp.org's latest release,
# resolved ONCE per run (the zipp job) into a release tag and the digest of its
# SHA256SUMS, and every lane installs exactly that pair with
# platform/scripts/fetch-zipp-release.mjs. release.yml passes the pair it froze
# instead.

name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The exact revision to verify (release.yml passes the tagged commit)
        required: false
        type: string
        default: ''
      zipp-release:
        description: The ZIPP release to verify with (release.yml passes the one it resolved); empty resolves the latest
        required: false
        type: string
        default: ''
      zipp-sums-sha256:
        description: The SHA-256 of that release's SHA256SUMS; passed together with zipp-release
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # The revision every lane below actually checked out. Recorded once so the
  # release evidence names it, and so a reusable call cannot silently verify
  # the caller's event revision instead of the requested one.
  revision:
    name: Resolve verified revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The ZIPP release every lane below installs, as {release, SHA256SUMS
  # digest}. Resolved once so a release ZIPP publishes mid-run cannot give two
  # lanes two engines; a caller's pair is re-read here and refused if the
  # release's SHA256SUMS has changed since the caller resolved it.
  zipp:
    name: Resolve the ZIPP release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      sums-sha256: ${{ steps.resolve.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: resolve
        shell: bash
        env:
          ZIPP_RELEASE: ${{ inputs.zipp-release || '' }}
          ZIPP_SUMS_SHA256: ${{ inputs.zipp-sums-sha256 || '' }}
        run: |
          set -euo pipefail
          ZIPP_RELEASE="${ZIPP_RELEASE:-}"; ZIPP_SUMS_SHA256="${ZIPP_SUMS_SHA256:-}"
          if [[ -n "$ZIPP_RELEASE" && -z "$ZIPP_SUMS_SHA256" ]] || [[ -z "$ZIPP_RELEASE" && -n "$ZIPP_SUMS_SHA256" ]]; then
            echo "::error::zipp-release and zipp-sums-sha256 are passed together or not at all"; exit 1
          fi
          if [[ -n "$ZIPP_RELEASE" ]]; then
            resolved="$(node platform/scripts/fetch-zipp-release.mjs --resolve-only)"
          else
            resolved="$(node platform/scripts/fetch-zipp-release.mjs --resolve-only --latest)"
          fi
          release="$(node -e 'console.log(JSON.parse(process.argv[1]).release)' "$resolved")"
          sums="$(node -e 'console.log(JSON.parse(process.argv[1]).sumsSha256)' "$resolved")"
          if [[ -n "$ZIPP_SUMS_SHA256" && "$sums" != "${ZIPP_SUMS_SHA256,,}" ]]; then
            echo "::error::the ZIPP $release SHA256SUMS is $sums now, not the $ZIPP_SUMS_SHA256 the caller resolved"; exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "sums-sha256=$sums" >> "$GITHUB_OUTPUT"
          echo "## ZIPP release: $release (SHA256SUMS $sums)" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web app tests
    needs: [revision, zipp]
    runs-on: ubuntu-latest
    env:
      ZIPP_RELEASE: ${{ needs.zipp.outputs.release }}
      ZIPP_SUMS_SHA256: ${{ needs.zipp.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/ui/package-lock.json
      - working-directory: platform/ui
        run: npm ci
      # Both engines, from the run's release. ui's pretest and prebuild hooks
      # would install them as well; a step of its own puts it in the log.
      - name: Install the ZIPP release
        run: node platform/scripts/fetch-zipp-release.mjs --ensure
      - name: ZIPP release installer tests
        run: node --test platform/scripts/fetch-zipp-release.test.mjs
      # Every path the workflows name exists in the checkout, or is made by the
      # build: the workflows moved once with paths written for another root, and a
      # wrong one is otherwise found only when a release is tagged. The tests are
      # the checker's own, its reader's, the release version rule's, what the
      # release's desktop legs do for the pages the installer carries, and what the
      # release does for the updater: the feed, the signatures, the evidence's
      # attestation and the check of a signature before the first release.
      - name: Workflow paths exist
        run: |
          node platform/scripts/check-workflow-paths.mjs
          node --test platform/scripts/workflow-yaml.test.mjs platform/scripts/check-workflow-paths.test.mjs platform/scripts/release-version.test.mjs platform/scripts/release-pages.test.mjs platform/scripts/release-updater.test.mjs platform/scripts/make-latest-json.test.mjs platform/scripts/minisign.test.mjs platform/scripts/verify-signature.test.mjs platform/scripts/attest-release-evidence.test.mjs platform/scripts/pe-imports.test.mjs
      # ECO-04: advisories at high or above fail the lane. An unreachable
      # registry is recorded as UNKNOWN in the run summary, never as clean, and
      # still fails: a release must carry a completed audit.
      - name: Dependency audit (high or above)
        working-directory: platform/ui
        shell: bash
        run: |
          set -o pipefail
          if out=$(npm audit --audit-level=high 2>&1); then
            echo "$out" | tail -n 3
            echo "## Dependency audit (ui): PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "$out" | tail -n 40
            if echo "$out" | grep -qiE 'ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|503|registry error|network'; then
              echo "## Dependency audit (ui): UNKNOWN (registry unreachable at $(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::npm audit could not reach the registry; result UNKNOWN, not clean"
            else
              echo "## Dependency audit (ui): FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$code"
          fi
      - working-directory: platform/ui
        run: npm test
      - name: Build
        working-directory: platform/ui
        run: npm run build

  # OAIY on the web (web/): the providers origin that holds the keys, and the scripts and tests that check its three hosts. The typecheck
  # and the unit tests (a fake IndexedDB, a real MessageChannel, the leak scans shown to find what they look for) run here on every
  # gate. The browser tests (npm run test:e2e: real origins in Chromium and Firefox) and the mutation checks (npm run test:mutations)
  # need the browsers and a few minutes, and are run by hand for now. No ZIPP engine: nothing here loads one.
  webapp:
    name: OAIY on the web (web/), typecheck and unit tests
    needs: [revision]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      # ECO-04, as in the lanes above: advisories at high or above fail the lane, and an unreachable registry is UNKNOWN, never clean.
      - name: Dependency audit (high or above)
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          if out=$(npm audit --audit-level=high 2>&1); then
            echo "$out" | tail -n 3
            echo "## Dependency audit (web): PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "$out" | tail -n 40
            if echo "$out" | grep -qiE 'ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|503|registry error|network'; then
              echo "## Dependency audit (web): UNKNOWN (registry unreachable at $(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::npm audit could not reach the registry; result UNKNOWN, not clean"
            else
              echo "## Dependency audit (web): FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$code"
          fi
      - name: Typecheck and unit tests (web/)
        working-directory: web
        run: npm test

  cli:
    name: CLI tests, typecheck and HTTPS shutdown
    needs: [revision, zipp]
    runs-on: ubuntu-latest
    env:
      ZIPP_RELEASE: ${{ needs.zipp.outputs.release }}
      ZIPP_SUMS_SHA256: ${{ needs.zipp.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/cli/package-lock.json
      - working-directory: platform/cli
        run: npm ci
      # The CLI and Desktop lanes install the run's release too (the installer
      # needs Node built-ins only, no ui dependencies), so both engines are
      # verified on the runners that build the CLI and Desktop, Windows included.
      - name: Install the ZIPP release
        run: node platform/scripts/fetch-zipp-release.mjs --ensure
      # ECO-04: advisories at high or above fail the lane. An unreachable
      # registry is recorded as UNKNOWN in the run summary, never as clean, and
      # still fails: a release must carry a completed audit.
      - name: Dependency audit (high or above)
        working-directory: platform/cli
        shell: bash
        run: |
          set -o pipefail
          if out=$(npm audit --audit-level=high 2>&1); then
            echo "$out" | tail -n 3
            echo "## Dependency audit (cli): PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "$out" | tail -n 40
            if echo "$out" | grep -qiE 'ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|503|registry error|network'; then
              echo "## Dependency audit (cli): UNKNOWN (registry unreachable at $(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::npm audit could not reach the registry; result UNKNOWN, not clean"
            else
              echo "## Dependency audit (cli): FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$code"
          fi
      - working-directory: platform/cli
        run: npm run build
      # The COMPLETE CLI test script (module isolation, SSRF guard, connector
      # module, engine suites, the ZIPP process-boundary suite and the four
      # engine guards below) plus the typecheck — release.yml used to run
      # only the HTTPS shutdown check (OAI-01).
      - working-directory: platform/cli
        run: npm test
      - working-directory: platform/cli
        run: npm run typecheck
      - name: Check CLI HTTPS shutdown
        working-directory: platform/cli
        run: node test/cli-http-exit.mjs
      # The ZIPP engine guards, each on its own so a failure is named in the
      # log. They are also part of `npm test` above; here they run against the
      # bundle `npm run build` just made, which every one of them spawns or
      # reads (a stale dist/ would pass them for the wrong revision).
      - name: ZIPP guard — the CLI runs flows on the ZIPP VM (process boundary)
        working-directory: platform/cli
        run: node test/zipp-cli.mjs
      - name: ZIPP guard A — no host eval in the bundles
        working-directory: platform/cli
        run: node test/no-host-eval.mjs
      - name: ZIPP guard — every runtime goes through createCliEngine
        working-directory: platform/cli
        run: node test/engine-wiring.mjs
      - name: ZIPP guards B, C, D — canary under the host-eval tripwire, realm, budget, timeout, engine_unavailable
        working-directory: platform/cli
        run: node test/zipp-guard.mjs
      - name: ZIPP boundary measurements (recorded, never hang)
        working-directory: platform/cli
        run: node test/zipp-limits.mjs
      # PR5: the leaf-script command (`oaiy script --request`, `--serve` and its
      # watchdog/recycle policy, `run --profile`) and the standalone CLI release
      # asset builder release.yml calls (inner SHA256SUMS, oaiy-cli.json).
      - name: ZIPP script command — envelope, --serve protocol, run --profile
        working-directory: platform/cli
        run: node test/zipp-script.mjs
      - name: CLI release asset — pack-cli-asset builds from a copy and verifies
        working-directory: platform/cli
        run: node test/cli-asset.mjs

  desktop:
    name: Desktop Vitest + native tests (${{ matrix.label }})
    needs: [revision, zipp]
    runs-on: ${{ matrix.os }}
    env:
      ZIPP_RELEASE: ${{ needs.zipp.outputs.release }}
      ZIPP_SUMS_SHA256: ${{ needs.zipp.outputs.sums-sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the ZIPP release
        run: node platform/scripts/fetch-zipp-release.mjs --ensure
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned revision)
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: platform/desktop/src-tauri
      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf build-essential curl wget file libssl-dev
      # The desktop bundles the headless CLI (platform/desktop/scripts/sync-cli.mjs
      # copies its esbuild output into src-tauri/resources), so the CLI has to
      # exist first.
      - name: Install and build the CLI
        working-directory: platform/cli
        run: |
          npm ci
          npm run build
      - name: Install the desktop app's dependencies
        working-directory: platform/desktop
        run: npm ci
      # ECO-04: advisories at high or above fail the lane. An unreachable
      # registry is recorded as UNKNOWN in the run summary, never as clean, and
      # still fails: a release must carry a completed audit.
      - name: Dependency audit (high or above)
        working-directory: platform/desktop
        shell: bash
        run: |
          set -o pipefail
          if out=$(npm audit --audit-level=high 2>&1); then
            echo "$out" | tail -n 3
            echo "## Dependency audit (desktop): PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "$out" | tail -n 40
            if echo "$out" | grep -qiE 'ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|503|registry error|network'; then
              echo "## Dependency audit (desktop): UNKNOWN (registry unreachable at $(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::npm audit could not reach the registry; result UNKNOWN, not clean"
            else
              echo "## Dependency audit (desktop): FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$code"
          fi
      # The desktop Vitest suite — never run by the release workflow before.
      - name: Desktop unit tests (Vitest)
        working-directory: platform/desktop
        run: npm test
      # The transfer_v1 contract folder (docs/contracts/transfer) is Aokie's, copied byte for byte: every
      # file is the one its lock (oaiy-only/SYNCED_FROM.json) records, and the check's own tests. Aokie's
      # repository is not checked out here, so the comparison with it and the lock's commit are SKIPPED
      # (a warning on the run, never a silent pass): they are run where both repositories are, with
      # AOKIE_TRANSFER_CONTRACTS set (see docs/contracts/transfer/oaiy-only/README.md).
      - name: Transfer contract folder (transfer_v1)
        working-directory: platform/desktop
        shell: bash
        run: npm run check:transfer-contract
      - name: Desktop typecheck + web build
        working-directory: platform/desktop
        run: npm run build
      # Who may call the Playwright server (Host, Origin, Fetch Metadata): the rules,
      # and the script itself on a free loopback port with a stub for the playwright
      # package, so no browser runs. Python's standard library only.
      - name: Playwright server guard tests (Python)
        shell: bash
        run: |
          # The one that runs: on a Windows runner python3 can be the Store stub, which is found and fails.
          py=python3; "$py" -c "" >/dev/null 2>&1 || py=python
          "$py" -m unittest discover -s platform/desktop/scripts -p "test_*.py"
      # Native tests in BOTH shipped configurations: the headless server (no
      # default features) and the GUI feature set the desktop installer ships.
      - name: Native tests (headless, no default features)
        working-directory: platform/desktop/src-tauri
        run: cargo test --locked --no-default-features
      # The headless server ships WITH the web login (release.yml builds it with `--features web`): its tests too.
      - name: 'Native tests (shipping headless server: the web login)'
        working-directory: platform/desktop/src-tauri
        run: cargo test --locked --no-default-features --features web
      - name: Native tests (shipping GUI features)
        working-directory: platform/desktop/src-tauri
        run: cargo test --locked --features gui

  # The two crates that hold the vault's keys (design 4.1 and 4.5.1, review L-10): oaiy-crypto and oaiy-keystore. Nothing else links them yet, so the desktop lane
  # above never builds them; these two lanes are where their tests run, on the two platforms the keystore has providers for. Both are in the release gate like every
  # job of this file (the release attests the lane names in platform/scripts/attest-release-evidence.mjs and release.yml, and a test keeps the three lists equal).
  # The tests that need root (the keystore's real other-user and uid-swap tests) are #[ignore]d and are run by hand, as crates/oaiy-keystore/README.md says.
  vault-linux:
    name: Vault crates (linux)
    needs: [revision]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned revision)
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Format
        run: cargo fmt --check -p oaiy-crypto -p oaiy-keystore -p oaiy-relay-core
      - name: Clippy (warnings are errors)
        run: |
          cargo clippy --locked -p oaiy-crypto -p oaiy-keystore -p oaiy-relay-core --all-targets -- -D warnings
          cargo clippy --locked -p oaiy-keystore --all-targets --features unsafe-keyfile -- -D warnings
          cargo clippy --locked -p oaiy-relay-core --lib -- -D warnings
      # oaiy-relay-core's real-relay layer (tests/relay_php.rs) starts the PHP relay of platform/relay on loopback in a scratch directory. It needs php with sodium and pdo_sqlite: this lane
      # makes sure it has them and then REQUIRES them (OAIY_REQUIRE_PHP: a missing PHP is a failure here, never a quiet skip). Everything else of the crate runs without PHP.
      - name: PHP for the real-relay tests of oaiy-relay-core
        shell: bash
        run: |
          set -euo pipefail
          if ! php -r 'exit(extension_loaded("sodium") && extension_loaded("pdo_sqlite") ? 0 : 1);' 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y php-cli php-sqlite3
          fi
          php -r 'exit(extension_loaded("sodium") && extension_loaded("pdo_sqlite") ? 0 : 1);'
          php --version | head -n 1
          echo "OAIY_PHP=php" >> "$GITHUB_ENV"
          echo "OAIY_REQUIRE_PHP=1" >> "$GITHUB_ENV"
          # The differential tests of the poll rules run python and node, which this lane has (setup-node above, python3 on the runner): a lane that loses them is red, not green.
          echo "OAIY_REQUIRE_TOOLS=1" >> "$GITHUB_ENV"
      # Both suites, as a product is built (no `unsafe-keyfile`: the refusal of the unsafe name is tested here), with the tests that look at memory (the allocator and dead-stack
      # probes) and the two-process, FIFO and symlink tests of the keystore; and then the keystore with `unsafe-keyfile`, which is the same on Unix and, on Windows, everything.
      - name: Tests
        run: |
          cargo test --locked --no-fail-fast -p oaiy-crypto -p oaiy-keystore -p oaiy-relay-core
          cargo test --locked --no-fail-fast -p oaiy-keystore --features unsafe-keyfile
      # The same probes in an optimised build, where the frames are small and the compiler keeps different copies: the dead-stack probe found leftovers there that a
      # debug build does not show (review L-7); and in a build with no optimisation and no debug assertions (the `vault-probe` profile of the workspace), where the
      # frames are largest and which neither `dev` nor `release` is (second review, low 1).
      - name: Memory probes (release build, and no optimisation with no assertions)
        run: |
          cargo test --locked --release -p oaiy-crypto --test zeroize_stack --test zeroize_text --test zeroize
          cargo test --locked --profile vault-probe -p oaiy-crypto --test zeroize_stack
      # The keystore's tests in a release build, as a product is built: the unsafe keyfile is refused there too (second review, low 2), by the parser and by the environment variable.
      - name: Keystore tests in a release build (no unsafe keyfile)
        run: cargo test --locked --release --no-fail-fast -p oaiy-keystore
      # The keystore has a macOS code path (Unix, no provider but the keyfile): it must compile for macOS, which no runner here executes.
      - name: Compile check for macOS
        run: cargo check --locked --target aarch64-apple-darwin -p oaiy-crypto -p oaiy-keystore --all-targets
      # `test-vectors` (sealing under a chosen nonce, deriving under any context) is for the crate's own tests. A build without dev-dependencies must not have it:
      # the documentation of that build has neither function.
      - name: The test-only entry points are absent from the library
        shell: bash
        run: |
          set -euo pipefail
          cargo doc --locked -p oaiy-crypto --no-deps
          docs=target/doc/oaiy_crypto
          test -f "$docs/aead/struct.Nonce.html"
          if test -e "$docs/kdf/fn.derive_subkey.html" || test -e "$docs/kdf/fn.derive_subkey_into.html" || grep -q 'id="method.from_bytes_for_tests"' "$docs/aead/struct.Nonce.html"; then
            echo "::error::a test-only function is in the library built without the test-vectors feature"; exit 1
          fi
      # `unsafe-keyfile` (the keyfile on Windows, where nothing here makes a file private) is for tests and is never in a product: the documentation of the library built without
      # the feature has no `KeyfileUnsafe`, and the tests above that run without the feature show that the name is refused.
      - name: The unsafe keyfile is absent from the keystore library
        shell: bash
        run: |
          set -euo pipefail
          cargo doc --locked -p oaiy-keystore --no-deps
          test -f target/doc/oaiy_keystore/enum.ProviderChoice.html
          if grep -q "KeyfileUnsafe" target/doc/oaiy_keystore/enum.ProviderChoice.html; then
            echo "::error::the unsafe keyfile is in the keystore built without the unsafe-keyfile feature"; exit 1
          fi
      # ECO-04 for the Rust side: the dependencies of these two crates only, warnings (yanked, unmaintained) denied. See the script for why not the whole lock.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Dependency audit (the two crates, warnings denied)
        run: node platform/scripts/audit-vault-crates.mjs

  vault-windows:
    name: Vault crates (windows)
    needs: [revision]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned revision)
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Format
        run: cargo fmt --check -p oaiy-crypto -p oaiy-keystore -p oaiy-relay-core
      - name: Clippy (warnings are errors)
        run: |
          cargo clippy --locked -p oaiy-crypto -p oaiy-keystore -p oaiy-relay-core --all-targets -- -D warnings
          cargo clippy --locked -p oaiy-keystore --all-targets --features unsafe-keyfile -- -D warnings
          cargo clippy --locked -p oaiy-relay-core --lib -- -D warnings
      # oaiy-relay-core's real-relay layer needs php with sodium and pdo_sqlite. If this runner has them it runs (OAIY_PHP names the binary); if not it SKIPS, and this step says so in the
      # log and as a warning annotation, so that a skip is never silent. (The linux lane requires it.)
      - name: PHP for the real-relay tests of oaiy-relay-core (skipped, loudly, where there is none)
        shell: pwsh
        run: |
          $php = (Get-Command php -ErrorAction SilentlyContinue).Source
          if ($php -and (& $php -r 'echo extension_loaded("sodium") && extension_loaded("pdo_sqlite") ? "ok" : "missing";') -eq 'ok') {
            "OAIY_PHP=$php" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "the real-relay tests of oaiy-relay-core run with $php"
          } else {
            Write-Host "::warning title=oaiy-relay-core::no php with sodium and pdo_sqlite on this runner: tests/relay_php.rs is SKIPPED here (the linux lane runs it)"
          }
      # DPAPI (the provider Windows has), the junction-above, rollback and held-folder tests, the hard-link test, the two-process test on a real DPAPI store; first as a product is
      # built (no `unsafe-keyfile`: Windows has no plaintext provider, and the refusal is tested), then with the feature, which adds the keyfile tests on Windows.
      - name: Tests
        run: |
          cargo test --locked --no-fail-fast -p oaiy-crypto -p oaiy-keystore -p oaiy-relay-core
          cargo test --locked --no-fail-fast -p oaiy-keystore --features unsafe-keyfile
      - name: Keystore tests in a release build (no unsafe keyfile)
        run: cargo test --locked --release --no-fail-fast -p oaiy-keystore
      - name: Memory probes (release build, and no optimisation with no assertions)
        run: |
          cargo test --locked --release -p oaiy-crypto --test zeroize_stack --test zeroize_text --test zeroize
          cargo test --locked --profile vault-probe -p oaiy-crypto --test zeroize_stack
