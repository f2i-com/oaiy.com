# Automatic CI is temporarily paused (cost control, 2026-09-12); run these
# checks manually from the Actions tab. Restore push/pull_request triggers
# when automatic checks are explicitly re-enabled.
#
# This workflow is ALSO the reusable verification gate (`workflow_call`) that
# release.yml runs at the EXACT tagged revision before anything is published
# (ecosystem review OAI-01 / ECO-01): the web app's test chain, the CLI's
# complete test script and typecheck, the desktop app's Vitest suite, and the
# native Rust tests in both the headless (no default features) and the
# shipping GUI feature configurations, each on the platform it ships on.
# A later commit can never inherit an earlier run's status: the caller
# passes the revision it is about to build, and every lane checks it out.
#
# The ZIPP engines are not committed. OAIY follows zipp.org's latest release,
# resolved ONCE per run (the zipp job) into a release tag and the digest of its
# SHA256SUMS, and every lane installs exactly that pair with
# scripts/fetch-zipp-release.mjs. release.yml passes the pair it froze instead.

name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The exact revision to verify (release.yml passes the tagged commit)
        required: false
        type: string
        default: ''
      zipp-release:
        description: The ZIPP release to verify with (release.yml passes the one it resolved); empty resolves the latest
        required: false
        type: string
        default: ''
      zipp-sums-sha256:
        description: The SHA-256 of that release's SHA256SUMS; passed together with zipp-release
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # The revision every lane below actually checked out. Recorded once so the
  # release evidence names it, and so a reusable call cannot silently verify
  # the caller's event revision instead of the requested one.
  revision:
    name: Resolve verified revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The ZIPP release every lane below installs, as {release, SHA256SUMS
  # digest}. Resolved once so a release ZIPP publishes mid-run cannot give two
  # lanes two engines; a caller's pair is re-read here and refused if the
  # release's SHA256SUMS has changed since the caller resolved it.
  zipp:
    name: Resolve the ZIPP release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      sums-sha256: ${{ steps.resolve.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: resolve
        shell: bash
        env:
          ZIPP_RELEASE: ${{ inputs.zipp-release || '' }}
          ZIPP_SUMS_SHA256: ${{ inputs.zipp-sums-sha256 || '' }}
        run: |
          set -euo pipefail
          ZIPP_RELEASE="${ZIPP_RELEASE:-}"; ZIPP_SUMS_SHA256="${ZIPP_SUMS_SHA256:-}"
          if [[ -n "$ZIPP_RELEASE" && -z "$ZIPP_SUMS_SHA256" ]] || [[ -z "$ZIPP_RELEASE" && -n "$ZIPP_SUMS_SHA256" ]]; then
            echo "::error::zipp-release and zipp-sums-sha256 are passed together or not at all"; exit 1
          fi
          if [[ -n "$ZIPP_RELEASE" ]]; then
            resolved="$(node scripts/fetch-zipp-release.mjs --resolve-only)"
          else
            resolved="$(node scripts/fetch-zipp-release.mjs --resolve-only --latest)"
          fi
          release="$(node -e 'console.log(JSON.parse(process.argv[1]).release)' "$resolved")"
          sums="$(node -e 'console.log(JSON.parse(process.argv[1]).sumsSha256)' "$resolved")"
          if [[ -n "$ZIPP_SUMS_SHA256" && "$sums" != "${ZIPP_SUMS_SHA256,,}" ]]; then
            echo "::error::the ZIPP $release SHA256SUMS is $sums now, not the $ZIPP_SUMS_SHA256 the caller resolved"; exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "sums-sha256=$sums" >> "$GITHUB_OUTPUT"
          echo "## ZIPP release: $release (SHA256SUMS $sums)" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web app tests
    needs: [revision, zipp]
    runs-on: ubuntu-latest
    env:
      ZIPP_RELEASE: ${{ needs.zipp.outputs.release }}
      ZIPP_SUMS_SHA256: ${{ needs.zipp.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci
      # Both engines, from the run's release. ui's pretest and prebuild hooks
      # would install them as well; a step of its own puts it in the log.
      - name: Install the ZIPP release
        run: node scripts/fetch-zipp-release.mjs --ensure
      - name: ZIPP release installer tests
        run: node --test scripts/fetch-zipp-release.test.mjs
      # ECO-04: advisories at high or above fail the lane. An unreachable
      # registry is recorded as UNKNOWN in the run summary, never as clean, and
      # still fails: a release must carry a completed audit.
      - name: Dependency audit (high or above)
        working-directory: ui
        shell: bash
        run: |
          set -o pipefail
          if out=$(npm audit --audit-level=high 2>&1); then
            echo "$out" | tail -n 3
            echo "## Dependency audit (ui): PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "$out" | tail -n 40
            if echo "$out" | grep -qiE 'ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|503|registry error|network'; then
              echo "## Dependency audit (ui): UNKNOWN (registry unreachable at $(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::npm audit could not reach the registry; result UNKNOWN, not clean"
            else
              echo "## Dependency audit (ui): FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$code"
          fi
      - working-directory: ui
        run: npm test
      - name: Build
        working-directory: ui
        run: npm run build

  cli:
    name: CLI tests, typecheck and HTTPS shutdown
    needs: [revision, zipp]
    runs-on: ubuntu-latest
    env:
      ZIPP_RELEASE: ${{ needs.zipp.outputs.release }}
      ZIPP_SUMS_SHA256: ${{ needs.zipp.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - working-directory: cli
        run: npm ci
      # The CLI and Desktop lanes install the run's release too (the installer
      # needs Node built-ins only, no ui dependencies), so both engines are
      # verified on the runners that build the CLI and Desktop, Windows included.
      - name: Install the ZIPP release
        run: node scripts/fetch-zipp-release.mjs --ensure
      # ECO-04: advisories at high or above fail the lane. An unreachable
      # registry is recorded as UNKNOWN in the run summary, never as clean, and
      # still fails: a release must carry a completed audit.
      - name: Dependency audit (high or above)
        working-directory: cli
        shell: bash
        run: |
          set -o pipefail
          if out=$(npm audit --audit-level=high 2>&1); then
            echo "$out" | tail -n 3
            echo "## Dependency audit (cli): PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "$out" | tail -n 40
            if echo "$out" | grep -qiE 'ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|503|registry error|network'; then
              echo "## Dependency audit (cli): UNKNOWN (registry unreachable at $(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::npm audit could not reach the registry; result UNKNOWN, not clean"
            else
              echo "## Dependency audit (cli): FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$code"
          fi
      - working-directory: cli
        run: npm run build
      # The COMPLETE CLI test script (module isolation, SSRF guard, connector
      # module, engine suites) plus the typecheck — release.yml used to run
      # only the HTTPS shutdown check (OAI-01).
      - working-directory: cli
        run: npm test
      - working-directory: cli
        run: npm run typecheck
      - name: Check CLI HTTPS shutdown
        working-directory: cli
        run: node test/cli-http-exit.mjs

  desktop:
    name: Desktop Vitest + native tests (${{ matrix.label }})
    needs: [revision, zipp]
    runs-on: ${{ matrix.os }}
    env:
      ZIPP_RELEASE: ${{ needs.zipp.outputs.release }}
      ZIPP_SUMS_SHA256: ${{ needs.zipp.outputs.sums-sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the ZIPP release
        run: node scripts/fetch-zipp-release.mjs --ensure
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned revision)
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf build-essential curl wget file libssl-dev
      # The desktop bundles the headless CLI (scripts/sync-cli.mjs copies its
      # esbuild output into src-tauri/resources), so the CLI has to exist first.
      - name: Install and build the CLI
        working-directory: cli
        run: |
          npm ci
          npm run build
      - name: Install the desktop app's dependencies
        working-directory: desktop
        run: npm ci
      # ECO-04: advisories at high or above fail the lane. An unreachable
      # registry is recorded as UNKNOWN in the run summary, never as clean, and
      # still fails: a release must carry a completed audit.
      - name: Dependency audit (high or above)
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          if out=$(npm audit --audit-level=high 2>&1); then
            echo "$out" | tail -n 3
            echo "## Dependency audit (desktop): PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo "$out" | tail -n 40
            if echo "$out" | grep -qiE 'ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|503|registry error|network'; then
              echo "## Dependency audit (desktop): UNKNOWN (registry unreachable at $(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::npm audit could not reach the registry; result UNKNOWN, not clean"
            else
              echo "## Dependency audit (desktop): FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$code"
          fi
      # The desktop Vitest suite — never run by the release workflow before.
      - name: Desktop unit tests (Vitest)
        working-directory: desktop
        run: npm test
      - name: Desktop typecheck + web build
        working-directory: desktop
        run: npm run build
      # Native tests in BOTH shipped configurations: the headless server (no
      # default features) and the GUI feature set the desktop installer ships.
      - name: Native tests (headless, no default features)
        working-directory: desktop/src-tauri
        run: cargo test --locked --no-default-features
      - name: Native tests (shipping GUI features)
        working-directory: desktop/src-tauri
        run: cargo test --locked --features gui
