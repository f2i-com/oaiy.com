# Release: tag a version, get everything built and attached to one GitHub Release.
#
#   git tag 0.1.0 && git push origin 0.1.0        (a leading "v" works too)
#
# A version below 0.1.0 is refused (see the version step of meta). docs/RELEASING.md
# says how to cut a release, and what is not in one.
#
# What lands on the release for that tag:
#
#   oaiy-web-<v>.zip / .tar.gz               the compiled static site — landing page at /,
#                                            the flow builder at /app.html, the desktop page at
#                                            /desktop.html, hashed assets, fonts, _headers.
#                                            Unzip onto any static host and it works.
#   oaiy-desktop-<v>-windows-x64-setup.exe   OAIY Desktop, NSIS installer
#   oaiy-desktop-<v>-windows-x64.msi         OAIY Desktop, MSI installer (a manual download: no update reaches it)
#   oaiy-desktop-<v>-linux-x86_64.AppImage   OAIY Desktop, portable
#   oaiy-desktop-<v>-linux-amd64.deb         OAIY Desktop, Debian/Ubuntu
#   oaiy-desktop-<v>-linux-x86_64.rpm        OAIY Desktop, Fedora/RHEL
#   <the setup.exe and the AppImage>.sig     their minisign signatures, made with the updater key
#   latest.json                              the update feed OAIY Desktop reads to see whether a newer
#                                            release exists (platform/scripts/make-latest-json.mjs)
#   oaiy-server-<v>-linux-x86_64.tar.gz      the headless server (no GUI, no GTK) for Linux hosts
#   oaiy-server-<v>-windows-x64.zip          the headless server for Windows
#   oaiy-cli-<v>.tar.gz                      the CLI alone (oaiy.mjs, both ZIPP worker shells, zipp/,
#                                            undici), OS-neutral, for a product that embeds it; carries
#                                            SHA256SUMS and oaiy-cli.json (= `oaiy capabilities --json`)
#   SHA256SUMS.txt                           covers every file above, latest.json and the .sig files too
#
# The two installers an update can install (the NSIS setup.exe and the AppImage) are signed
# with the updater key in ONE place: the `sign` job. It runs on a tag only, in the `release`
# environment that holds the secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (docs/RELEASING.md, The updater key), after the
# verification gate and every build have passed. The builds are unsigned and no step that
# builds anything is given the key. A run on a branch builds unsigned installers and never signs.
#
# The tag is the version. It is stamped into
# platform/desktop/src-tauri/tauri.conf.json and Cargo.toml at build time
# (never committed), so the installers, the app's About box and the file names
# all agree with the tag without a release commit.
#
# The web build is made with VITE_API_BASE unset: a fully standalone site with
# sharing off. To ship a build wired to a backend, set that variable in this
# repository's Actions variables (Settings -> Secrets and variables -> Actions
# -> Variables) and it is picked up below.
#
# Verification (ecosystem review OAI-01 / ECO-01): every artifact is built
# from ONE resolved revision, and publication depends on the reusable CI gate
# (ci.yml via workflow_call) having passed AT THAT REVISION — the web suite,
# the complete CLI test script and typecheck, the desktop Vitest suite, the
# native Rust tests in both the headless and GUI configurations, and the two vault
# crates (oaiy-crypto and oaiy-keystore: the vault-linux and vault-windows lanes of
# ci.yml: format, clippy, tests, memory probes and a dependency audit). A manual
# dispatch cannot substitute an older green run: the gate runs fresh, on the
# commit that is built. Each artifact ships with release-evidence.json naming
# the revision, target, features, toolchain, artifact digests and the smoke
# results, and the release job refuses to publish evidence for any other
# revision than the one it verified.
#
# Evidence is finalised AFTER verification (R3-OAI-01): the build jobs run in
# parallel with the gate and write their evidence as `unverified` / audit
# `pending`, so a workflow artifact from a failed or incomplete run never
# claims a result the run did not establish. The release job, which depends
# on the gate, runs platform/scripts/attest-release-evidence.mjs: it
# requires the gate's explicit success, re-checks every artifact digest
# against the bytes about to be published, and only then stamps `verified` /
# `pass` together with the exact verification run (id, attempt, URL, ci.yml
# jobs).
#
# One ZIPP per release: meta resolves zipp.org's latest release once, as the
# tag and the digest of its SHA256SUMS, and every job installs exactly that
# pair (platform/scripts/fetch-zipp-release.mjs); the verification gate is
# handed the same pair. The web job re-verifies the engines against the
# published release before packaging and records the engine the site ships
# in its evidence. (The Agent inside the desktop installer carries the ZIPP
# release app/ pins, not this one, and the evidence does not record it.)

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0; not below it). Run on a branch, this builds and uploads artifacts only. Run on a tag, the tag is the version and the release is published.'
        required: true

# Nothing may write by default: the job that publishes the release says so for itself.
permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------- version
  meta:
    name: Resolve version and revision
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
      revision: ${{ steps.rev.outputs.sha }}
      zipp-release: ${{ steps.zipp.outputs.release }}
      zipp-sums-sha256: ${{ steps.zipp.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The ONE revision every job below builds and verifies.
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The ONE ZIPP release every job below installs, frozen with the digest of
      # its SHA256SUMS so a release ZIPP publishes mid-run changes nothing here.
      - id: zipp
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(node platform/scripts/fetch-zipp-release.mjs --resolve-only --latest)"
          release="$(node -e 'console.log(JSON.parse(process.argv[1]).release)' "$resolved")"
          sums="$(node -e 'console.log(JSON.parse(process.argv[1]).sumsSha256)' "$resolved")"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "sums-sha256=$sums" >> "$GITHUB_OUTPUT"
          echo "Building with ZIPP $release (SHA256SUMS $sums)"
      - id: v
        shell: bash
        # A manual run's version is typed by whoever starts it, so it reaches the
        # script as data. Pasted into the script (${{ }} in its text) it would be
        # shell, and could rewrite the version this step checks.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            raw="${GITHUB_REF#refs/tags/}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            raw="$INPUT_VERSION"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          version="${raw#v}"
          # N.N.N with no leading zeros: Cargo refuses 0.09.0, and only the desktop
          # legs would find it, after the whole gate had run.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$raw' is not a version of the form 0.1.0 (three numbers, none with a leading zero)"; exit 1
          fi
          # The desktop takes this version as its own (stamped into Cargo.toml),
          # and refuses a plugin whose manifest asks for a newer desktop. Aokie's
          # asks for 0.1.0, so a release below it could not run Aokie.
          IFS=. read -r major minor _ <<< "$version"
          if [[ "$major" == 0 && "$minor" == 0 ]]; then
            echo "::error::version $version is below 0.1.0: Aokie's plugin manifest needs a desktop of 0.1.0 or later, and the installers are stamped with the tag. Tag 0.1.0 or a later version."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  # ---------------------------------------------------------------- verification
  # The reusable gate, at the exact revision resolved above (OAI-01).
  verify:
    name: Verify the release revision
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.meta.outputs.revision }}
      zipp-release: ${{ needs.meta.outputs.zipp-release }}
      zipp-sums-sha256: ${{ needs.meta.outputs.zipp-sums-sha256 }}

  # ---------------------------------------------------------------- web site
  web:
    name: Web site (landing + app)
    needs: meta
    runs-on: ubuntu-latest
    env:
      ZIPP_RELEASE: ${{ needs.meta.outputs.zipp-release }}
      ZIPP_SUMS_SHA256: ${{ needs.meta.outputs.zipp-sums-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/ui/package-lock.json

      - name: Install
        working-directory: platform/ui
        run: npm ci

      - name: Install the ZIPP release
        run: node platform/scripts/fetch-zipp-release.mjs --ensure

      - name: Test
        working-directory: platform/ui
        run: npm test

      - name: Build
        working-directory: platform/ui
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_OAIY_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run build

      # The installed bytes against what the release publishes now, right
      # before they are packaged: ZIPP's SHA256SUMS and every file taken.
      - name: Re-verify the ZIPP engines against the published release
        run: node platform/scripts/fetch-zipp-release.mjs --check --online

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          out="$PWD/release"; mkdir -p "$out"
          cat > platform/ui/dist/HOSTING.md <<EOF
          # OAIY web site $VERSION

          This folder is the complete static site: the landing page (index.html),
          the flow builder (app.html) and the desktop-app page (desktop.html), with
          their assets. Upload it as-is to any static host — S3, Netlify, Cloudflare
          Pages, nginx, Apache. No server-side rendering, no rewrite rules needed.

          _headers is read by Netlify and Cloudflare Pages; it sets the strict
          Content-Security-Policy for the package-compiler sandbox worker. Other hosts
          should apply the equivalent header to /assets/compiler-sandbox-worker-*.js
          (see the comments inside the file).

          Built with VITE_API_BASE="${VITE_API_BASE:-}". Empty means standalone: no
          sharing backend, everything runs in the browser.
          EOF
          (cd platform/ui/dist && zip -qr "$out/oaiy-web-$VERSION.zip" .)
          tar -C platform/ui/dist -czf "$out/oaiy-web-$VERSION.tar.gz" .
          ls -l "$out"

      - name: Release evidence (web)
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          REVISION: ${{ needs.meta.outputs.revision }}
        run: |
          node -e '
            const fs = require("fs"); const crypto = require("crypto"); const path = require("path");
            const files = fs.readdirSync("release").map(name => ({ name, sha256: crypto.createHash("sha256").update(fs.readFileSync(path.join("release", name))).digest("hex") }));
            // The engine the site ships is the installed one, found among the built assets by its digest.
            const digest = file => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            const zipp = JSON.parse(fs.readFileSync("platform/ui/vendor/zipp-wasm/SOURCE.json", "utf8"));
            // The release notes name the pair meta froze, so the evidence must describe that very install.
            if (zipp.release !== process.env.ZIPP_RELEASE || zipp.sumsSha256 !== process.env.ZIPP_SUMS_SHA256) { console.error("::error::the installed ZIPP is " + zipp.release + " (SHA256SUMS " + zipp.sumsSha256 + "), not the " + process.env.ZIPP_RELEASE + " (" + process.env.ZIPP_SUMS_SHA256 + ") meta froze"); process.exit(1); }
            const shipped = fs.readdirSync("platform/ui/dist/assets").filter(name => name.endsWith(".wasm") && digest(path.join("platform/ui/dist/assets", name)) === zipp.sha256);
            if (shipped.length !== 1) { console.error("::error::the built site does not ship the installed ZIPP engine " + zipp.sha256 + " exactly once (found " + shipped.length + ")"); process.exit(1); }
            fs.writeFileSync("release/release-evidence-web.json", JSON.stringify({
              component: "web", version: process.env.VERSION, revision: process.env.REVISION,
              target: "static-site", features: [], toolchain: { node: process.version },
              engine: {
                name: "zipp", repository: zipp.repository, release: zipp.release, revision: zipp.revision,
                bundle: zipp.bundle, bundleSha256: zipp.bundleSha256, sumsSha256: zipp.sumsSha256,
                wasmSha256: zipp.sha256, glueSha256: zipp.glueSha256, asset: "assets/" + shipped[0],
              },
              tests: { web: "npm test (ui)", zippInstall: "platform/scripts/fetch-zipp-release.mjs --check --online" },
              // This job runs in parallel with the verification gate and cannot know its
              // result: the release job attests these two fields after the gate passed
              // (platform/scripts/attest-release-evidence.mjs, R3-OAI-01). A build artifact from an
              // incomplete or failed run therefore never claims a passing verification.
              // (No apostrophes in these comments: they sit inside a single-quoted shell string.)
              verification: { status: "unverified", gate: ".github/workflows/ci.yml@" + process.env.REVISION },
              dependencyAudit: { status: "pending", tool: "npm audit --audit-level=high (ci.yml: ui, cli, desktop); cargo audit --deny warnings (ci.yml: vault-linux, the vault crates)", level: "high", revision: process.env.REVISION },
              artifacts: files, builtAt: new Date().toISOString(),
            }, null, 2) + "\n");
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: release/*
          if-no-files-found: error

  # ---------------------------------------------------------------- desktop
  desktop:
    name: Desktop (${{ matrix.label }})
    needs: meta
    runs-on: ${{ matrix.os }}
    # The digest of the installer an update can install, as this leg made it (the step "Record the installer's digest"). Each leg sets
    # its own output; the two are merged for the jobs that need this one. The sign job compares what it downloads with them: a job output
    # travels apart from the artifact store, which is where a swapped or altered installer would be.
    outputs:
      windows-setup-sha256: ${{ steps.digests.outputs.windows-setup-sha256 }}
      linux-appimage-sha256: ${{ steps.digests.outputs.linux-appimage-sha256 }}
    env:
      ZIPP_RELEASE: ${{ needs.meta.outputs.zipp-release }}
      ZIPP_SUMS_SHA256: ${{ needs.meta.outputs.zipp-sums-sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.revision }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The release's one ZIPP, installed from meta's pair as in every job, so
      # a build of this leg can only ever see that release's engines.
      - name: Install the ZIPP release
        run: node platform/scripts/fetch-zipp-release.mjs --ensure

      # Pinned to a revision of the `stable` branch, upgraded deliberately.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned revision)

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: platform/desktop/src-tauri

      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf build-essential curl wget file libssl-dev

      - name: Stamp the version from the tag
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          node -e '
            const fs = require("fs"); const v = process.argv[1];
            const conf = "platform/desktop/src-tauri/tauri.conf.json";
            const j = JSON.parse(fs.readFileSync(conf, "utf8")); j.version = v;
            fs.writeFileSync(conf, JSON.stringify(j, null, 2) + "\n");
            const toml = "platform/desktop/src-tauri/Cargo.toml";
            fs.writeFileSync(toml, fs.readFileSync(toml, "utf8").replace(/^version = "[^"]+"/m, `version = "${v}"`));
            console.log("stamped", v);
          ' "$VERSION"

      # The desktop bundles the headless CLI (platform/desktop/scripts/sync-cli.mjs
      # copies its esbuild output into src-tauri/resources), so the CLI has to
      # exist first.
      - name: Install and build the CLI
        working-directory: platform/cli
        run: |
          npm ci
          npm run build

      - name: Check CLI HTTPS shutdown
        working-directory: platform/cli
        run: node test/cli-http-exit.mjs

      # The installer carries the Agent and the flow editor too: tauri build
      # stages their builds into src-tauri/resources first
      # (platform/desktop/scripts/stage-pages.mjs, from beforeBuildCommand) and
      # stops if either is missing or incomplete, so both are built here. The
      # Agent's build:desktop also fetches the SoftN runtime its app preview
      # needs. The flow editor is built standalone (no VITE_API_BASE): an
      # installed app does not talk to a hosted sharing backend.
      #
      # The Agent pins its own ZIPP and SoftN (app/scripts/fetch-zipp.mjs and
      # fetch-softn.mjs) and reads ZIPP_SUMS_SHA256 as a replacement for its pin,
      # so the release's pair, set for the whole job, is cleared for it: checked
      # against the digest of another ZIPP release, its own would be refused.
      - name: Install and build the Agent
        working-directory: app
        env:
          ZIPP_RELEASE: ''
          ZIPP_SUMS_SHA256: ''
        run: |
          npm ci
          npm run build:desktop

      - name: Install and build the flow editor
        working-directory: platform/ui
        run: |
          npm ci
          npm run build

      - name: Install the desktop app's dependencies
        working-directory: platform/desktop
        run: npm ci

      # The installers are built UNSIGNED, on every run, tag or branch. This step runs
      # the project's npm packages and Rust crates, so it is given no secret at all: the
      # updater key is used in the `sign` job, which only signs what these builds made
      # (and only on a tag, after the gate). tauri.conf.json does not turn the updater
      # artifacts on, so nothing here asks for a signature.
      - name: Build OAIY Desktop
        shell: bash
        working-directory: platform/desktop
        run: |
          set -euo pipefail
          npm run tauri:build
          echo "::notice::this build is unsigned: no step that builds is given the updater key. A tag run signs the setup.exe and the AppImage afterwards, in the sign job; a run on a branch never signs."

      - name: Build the headless server
        working-directory: platform/desktop/src-tauri
        run: cargo build --release --no-default-features --bin oaiy-server

      - name: Stage complete headless distribution
        shell: bash
        run: |
          server=platform/desktop/src-tauri/target/release/oaiy-server
          [[ "$RUNNER_OS" == "Windows" ]] && server="$server.exe"
          node platform/desktop/scripts/package-server.mjs "$server" headless-dist

      - name: Execute a flow from the headless distribution
        run: node platform/desktop/scripts/smoke-server.mjs headless-dist

      - name: Collect
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          out="$PWD/release"; mkdir -p "$out"
          bundle="platform/desktop/src-tauri/target/release/bundle"
          find "$bundle" -type f | sort
          # The installers an update can install get their signatures later, in the sign
          # job (a tag run): it signs these very files, so they are copied under their
          # release names and nothing else is done to them.
          if [[ "$LABEL" == "windows" ]]; then
            setup="$(find "$bundle" -type f -name '*-setup.exe' | head -1)"
            cp "$setup" "$out/oaiy-desktop-$VERSION-windows-x64-setup.exe"
            cp "$(find "$bundle" -type f -name '*.msi' | head -1)"       "$out/oaiy-desktop-$VERSION-windows-x64.msi"
            ( cd headless-dist && 7z a -bd "$out/oaiy-server-$VERSION-windows-x64.zip" . >/dev/null )
          else
            appimage="$(find "$bundle" -type f -name '*.AppImage' | head -1)"
            cp "$appimage" "$out/oaiy-desktop-$VERSION-linux-x86_64.AppImage"
            cp "$(find "$bundle" -type f -name '*.deb' | head -1)"      "$out/oaiy-desktop-$VERSION-linux-amd64.deb"
            rpm="$(find "$bundle" -type f -name '*.rpm' | head -1 || true)"
            [[ -n "$rpm" ]] && cp "$rpm" "$out/oaiy-desktop-$VERSION-linux-x86_64.rpm"
            tar -C headless-dist -czf "$out/oaiy-server-$VERSION-linux-x86_64.tar.gz" .
            # The CLI alone, built ONCE (this leg) from a COPY of the staged
            # resources/cli — the folder package-server.mjs already inventoried
            # and smoke-server.mjs re-hashes, so it is never written to. The
            # tarball carries SHA256SUMS and oaiy-cli.json, the copy's own
            # `capabilities --json` (protocols, engine, languages), which a
            # consumer embedding the CLI compares against what it speaks. The
            # summary feeds the evidence below; it is not an asset itself.
            node platform/scripts/pack-cli-asset.mjs platform/desktop/src-tauri/resources/cli "$out/oaiy-cli-$VERSION.tar.gz" --summary cli-asset-summary.json
          fi
          ls -l "$out"

      # The installer an update can install, as it now sits in release/ (the very file the artifact carries): its digest goes out as a job
      # output. The sign job signs the bytes that have it, and no others.
      - name: Record the installer's digest
        id: digests
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          if [[ "$LABEL" == "windows" ]]; then
            name="windows-setup-sha256"; file="release/oaiy-desktop-$VERSION-windows-x64-setup.exe"
          else
            name="linux-appimage-sha256"; file="release/oaiy-desktop-$VERSION-linux-x86_64.AppImage"
          fi
          [[ -s "$file" ]] || { echo "::error::$file is not there to record"; exit 1; }
          echo "$name=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The final ARCHIVE (not the developer tree) starts with an empty profile,
      # no system Node/npm on PATH and no checkout paths: smoke-server.mjs
      # builds that environment itself.
      - name: Verify the extracted headless release (fresh profile)
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir headless-verified
          if [[ "$LABEL" == "windows" ]]; then
            7z x -bd "release/oaiy-server-$VERSION-windows-x64.zip" -oheadless-verified >/dev/null
          else
            tar -C headless-verified -xzf "release/oaiy-server-$VERSION-linux-x86_64.tar.gz"
          fi
          node platform/desktop/scripts/smoke-server.mjs headless-verified

      # Source revision, target, features, toolchain, artifact digests and the
      # tests that ran, recorded TOGETHER per artifact set (OAI-01).
      - name: Release evidence (${{ matrix.label }})
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          REVISION: ${{ needs.meta.outputs.revision }}
          LABEL: ${{ matrix.label }}
        run: |
          RUSTC="$(rustc --version)"; CARGO="$(cargo --version)"
          node -e '
            const fs = require("fs"); const crypto = require("crypto"); const path = require("path");
            const files = fs.readdirSync("release").map(name => ({ name, sha256: crypto.createHash("sha256").update(fs.readFileSync(path.join("release", name))).digest("hex") }));
            // The standalone CLI asset (linux leg only): its digest and the protocols/engine record its oaiy-cli.json carries.
            const cliSummary = fs.existsSync("cli-asset-summary.json") ? JSON.parse(fs.readFileSync("cli-asset-summary.json", "utf8")) : null;
            const cli = cliSummary ? { asset: cliSummary.asset, sha256: cliSummary.sha256, protocols: cliSummary.capabilities.protocols, engine: cliSummary.capabilities.engine, run: cliSummary.capabilities.run, script: cliSummary.capabilities.script } : undefined;
            fs.writeFileSync(`release/release-evidence-${process.env.LABEL}.json`, JSON.stringify({
              component: "desktop+headless", version: process.env.VERSION, revision: process.env.REVISION,
              target: process.env.LABEL, runner: process.env.RUNNER_OS,
              features: { desktop: ["gui"], headless: ["--no-default-features"] },
              cli,
              // The Node version comes from the runtime itself (an unexported shell variable used to leave it empty).
              toolchain: { rustc: process.argv[1], cargo: process.argv[2], node: process.version },
              // Attested by the release job after the gate passed (see the note in the web job).
              verification: { status: "unverified", gate: ".github/workflows/ci.yml@" + process.env.REVISION + " (web, cli npm test + typecheck, desktop vitest, cargo test headless + gui, vault crates: cargo test + clippy + memory probes, npm audit high, cargo audit of the vault crates)" },
              dependencyAudit: { status: "pending", tool: "npm audit --audit-level=high (ci.yml: ui, cli, desktop); cargo audit --deny warnings (ci.yml: vault-linux, the vault crates)", level: "high", revision: process.env.REVISION },
              tests: {
                cliHttpsShutdown: "node test/cli-http-exit.mjs", stagedHeadlessSmoke: "smoke-server.mjs headless-dist",
                extractedHeadlessSmoke: "smoke-server.mjs headless-verified (fresh profile, no system Node)",
              },
              artifacts: files, builtAt: new Date().toISOString(),
            }, null, 2) + "\n");
          ' "$RUSTC" "$CARGO"
          cat "release/release-evidence-$LABEL.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  # ---------------------------------------------------------------- signing
  # The only place the updater key is used, and the only job that can read it. The
  # `release` environment holds the two secrets, and its rules (tags only, a required
  # reviewer: docs/RELEASING.md) decide when a run may have them. The job starts on a tag
  # only, after the verification gate and the desktop builds, and does one thing to what
  # the builds made: it signs the NSIS setup.exe and the AppImage with `tauri signer sign`,
  # under the names the Tauri bundler gives them (OAIY_<v>_x64-setup.exe,
  # OAIY_<v>_amd64.AppImage), because the desktop holds a signature to its version by the
  # name of the file it was made for. It builds nothing and runs none of the project's own
  # code: the Tauri CLI is installed from the desktop app's lockfile with no install scripts.
  sign:
    name: Sign the installers an update installs
    needs: [meta, verify, desktop]
    if: needs.meta.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The two desktop builds' artifacts by their exact names (never a pattern that would take whatever else matches), each into a folder
      # of its own, so that what one leg made cannot stand in for the other's.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows
          path: artifacts/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-linux
          path: artifacts/linux

      # The Tauri CLI, from the lockfile, and no install scripts: nothing here needs one.
      - name: Install the Tauri CLI
        working-directory: platform/desktop
        run: npm ci --ignore-scripts

      - name: Sign the setup.exe and the AppImage
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          # What the desktop legs recorded of the installers they made (job outputs of the build, not of the artifact).
          WINDOWS_SETUP_SHA256: ${{ needs.desktop.outputs.windows-setup-sha256 }}
          LINUX_APPIMAGE_SHA256: ${{ needs.desktop.outputs.linux-appimage-sha256 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A secret set from a file can end in a newline (`gh secret set` reads its standard input as it comes), and the Tauri CLI refuses both
          # values with one ("Invalid symbol 10" for the key, "Wrong password for that key"): each is what is before its line ending. (Parameter
          # expansion, not command substitution, which strips differently in different shells.)
          key="$TAURI_SIGNING_PRIVATE_KEY"
          while [[ "$key" == *$'\n' || "$key" == *$'\r' ]]; do key="${key%$'\n'}"; key="${key%$'\r'}"; done
          password="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          while [[ "$password" == *$'\n' || "$password" == *$'\r' ]]; do password="${password%$'\n'}"; password="${password%$'\r'}"; done
          missing=""
          [[ -n "$key" ]] || missing="TAURI_SIGNING_PRIVATE_KEY"
          [[ -n "$password" ]] || missing="${missing:+$missing and }TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [[ -n "$missing" ]]; then
            echo "::error::a release must be signed for OAIY's updater, and the secret $missing is not set in the release environment (Settings, Environments, release). See docs/RELEASING.md, The updater key."
            exit 1
          fi
          export TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$password"
          artifacts="$GITHUB_WORKSPACE/artifacts"
          work="$RUNNER_TEMP/signing"; out="$GITHUB_WORKSPACE/signatures"
          mkdir -p "$work" "$out"
          # What is signed is what the desktop build made: the installer is there, its digest is the one the build recorded, and no signature
          # and no other installer of the kinds this job signs came with it. Anything else stops the job before anything is signed.
          refuse() { echo "::error::$1"; exit 1; }
          check_input() {
            local dir="$1" asset="$2" expected="$3" extra actual
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || refuse "the desktop build recorded no digest for $asset, so it is not signed"
            [[ -s "$dir/$asset" ]] || refuse "$asset is not among the desktop builds' artifacts"
            actual="$(sha256sum "$dir/$asset" | cut -d' ' -f1)"
            [[ "$actual" == "$expected" ]] || refuse "$asset is not what the desktop build made: its digest is $actual and the build recorded $expected"
            extra="$(find "$dir" -type f \( -name '*.sig' -o -name '*-setup.exe' -o -name '*.AppImage' \) ! -name "$asset")"
            [[ -z "$extra" ]] || refuse "the desktop build's artifacts hold ${extra%%$'\n'*} beside $asset: nothing but the installer is signed, and no signature comes from a build"
          }
          check_input "$artifacts/windows" "oaiy-desktop-$VERSION-windows-x64-setup.exe" "$WINDOWS_SETUP_SHA256"
          check_input "$artifacts/linux" "oaiy-desktop-$VERSION-linux-x86_64.AppImage" "$LINUX_APPIMAGE_SHA256"
          sign_as() {
            local dir="$1" asset="$2" bundled="$3"
            cp "$dir/$asset" "$work/$bundled"
            "$GITHUB_WORKSPACE/platform/desktop/node_modules/.bin/tauri" signer sign "$work/$bundled" >/dev/null
            [[ -s "$work/$bundled.sig" ]] || { echo "::error::tauri signer sign made no signature for $asset"; exit 1; }
            cp "$work/$bundled.sig" "$out/$asset.sig"
          }
          sign_as "$artifacts/windows" "oaiy-desktop-$VERSION-windows-x64-setup.exe" "OAIY_${VERSION}_x64-setup.exe"
          sign_as "$artifacts/linux" "oaiy-desktop-$VERSION-linux-x86_64.AppImage" "OAIY_${VERSION}_amd64.AppImage"
          ls -l "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signatures
          path: signatures/*
          if-no-files-found: error

  # ---------------------------------------------------------------- release
  release:
    name: Publish release
    # Publication needs the verification gate, every build AND the signatures, all at
    # the same resolved revision (OAI-01): a failing test in any lane blocks it.
    needs: [meta, verify, web, desktop, sign]
    if: needs.meta.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    # The only job that writes to the repository (it publishes the release).
    permissions:
      contents: write
    steps:
      # The attestation script is taken from the verified revision itself.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      # Only now, with the gate's result known, does evidence say "verified" /
      # "pass" (R3-OAI-01). The script refuses on anything but an explicit
      # success, on a foreign revision, and on any artifact whose bytes no
      # longer match the digest the build recorded; it writes nothing unless
      # every file passes.
      - name: Attest release evidence from the completed verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          REVISION: ${{ needs.meta.outputs.revision }}
          VERIFY_WORKFLOW: .github/workflows/ci.yml
          VERIFY_JOBS: revision,zipp,web,cli,desktop (linux),desktop (windows),vault-linux,vault-windows
        run: node platform/scripts/attest-release-evidence.mjs --dir artifacts

      # Every evidence file must name the revision this workflow verified and
      # carry the attested statuses; a file still pending/unverified stops the release.
      - name: Check release evidence names the verified revision
        working-directory: artifacts
        env:
          REVISION: ${{ needs.meta.outputs.revision }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" == "$TAG_SHA" ]] || { echo "::error::verified revision $REVISION differs from the tagged commit $TAG_SHA"; exit 1; }
          count=0
          for f in release-evidence-*.json; do
            read -r rev vstatus astatus run_id < <(node -e '
              const e = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              console.log([e.revision, e.verification && e.verification.status, e.dependencyAudit && e.dependencyAudit.status, e.verification && e.verification.run && e.verification.run.id].join(" "));
            ' "$f")
            [[ "$rev" == "$REVISION" ]] || { echo "::error::$f records revision $rev, expected $REVISION"; exit 1; }
            [[ "$vstatus" == "verified" ]] || { echo "::error::$f verification status is '$vstatus', not 'verified'"; exit 1; }
            [[ "$astatus" == "pass" ]] || { echo "::error::$f dependency audit status is '$astatus', not 'pass'"; exit 1; }
            [[ "$run_id" == "$GITHUB_RUN_ID" ]] || { echo "::error::$f was attested by run '$run_id', not this run $GITHUB_RUN_ID"; exit 1; }
            count=$((count+1))
          done
          [[ "$count" -ge 3 ]] || { echo "::error::expected evidence for web, linux and windows; found $count"; exit 1; }
          echo "release evidence verified for $REVISION ($count files, run $GITHUB_RUN_ID attempt ${GITHUB_RUN_ATTEMPT:-1})"

      # The update feed OAIY Desktop reads (releases/latest/download/latest.json):
      # each platform's installer, its signature (the content of the .sig the build
      # made) and where the release publishes it. It stops the release when an
      # installer or a signature is missing, so the release GitHub calls the latest
      # is never one whose feed is short, and when a signature does not verify against
      # the public key in tauri.conf.json (the Tauri CLI only warns when the secrets hold
      # another key, and no installed OAIY could then install this release). Written
      # before the checksums, which then cover it and the signatures.
      - name: Update feed (latest.json)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: node platform/scripts/make-latest-json.mjs --dir artifacts --version "$VERSION" --tag "$TAG" --repo "$GITHUB_REPOSITORY" --conf platform/desktop/src-tauri/tauri.conf.json

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ZIPP_RELEASE: ${{ needs.meta.outputs.zipp-release }}
        run: |
          cat > notes.md <<EOF
          ## What is in this release

          **Web site** — \`oaiy-web-$VERSION.zip\` (or \`.tar.gz\`) is the compiled static site:
          the landing page at \`/\`, the flow builder at \`/app.html\` and the desktop-app page at
          \`/desktop.html\`. Unzip it onto any static host. \`HOSTING.md\` inside explains the one
          header worth setting. Its flow sandbox runs the JavaScript engine of
          [ZIPP $ZIPP_RELEASE](https://github.com/f2i-com/zipp.org/releases/tag/$ZIPP_RELEASE), verified
          against that release's \`SHA256SUMS\`; \`release-evidence-web.json\` records its digests.

          **OAIY Desktop** — the tray app that manages local model servers, downloads, Python and
          the browser sidecar for the web app. It has the Agent and the flow editor inside; the
          engines are not built here.
          - Windows: \`oaiy-desktop-$VERSION-windows-x64-setup.exe\` (installer) or the \`.msi\`
          - Linux: \`.AppImage\` (portable), \`.deb\` (Debian/Ubuntu) or \`.rpm\` (Fedora/RHEL)
          - OAIY Desktop looks here for a newer version (\`latest.json\`, with the \`.sig\` signatures of
            the setup.exe and the AppImage) and installs one only when you press the button in Settings.
            The \`.msi\`, \`.deb\` and \`.rpm\` are not updated from inside OAIY: download a newer one.

          **oaiy-server** — the same local API with no window, tray or GTK, for a Linux or
          Windows host that the CLI or a hosted web app drives. See \`platform/desktop/README.md\`.

          **oaiy-cli** — \`oaiy-cli-$VERSION.tar.gz\` is the CLI alone, OS-neutral (JavaScript +
          the ZIPP $ZIPP_RELEASE web-python engine), for a product that embeds it: \`oaiy.mjs\`, both
          worker shells, \`zipp/\`, \`node_modules/undici\`, an inner \`SHA256SUMS\`, and \`oaiy-cli.json\` —
          the CLI's own \`oaiy capabilities --json\` (protocols, engine identity and health, the languages
          \`run\` and \`script\` accept). \`release-evidence-linux.json\` records the same under \`cli\`.

          \`SHA256SUMS.txt\` covers every file above. \`release-evidence-*.json\` records, per
          artifact set, the source revision, target, features, toolchain, digests, the tests
          that ran, and the exact verification run (id, attempt, jobs) that passed before
          publication attested them.
          EOF

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OAIY ${{ needs.meta.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
