# Mac update: what an installed OAIY on a Mac updates itself from, added to a release that is already published.
#
# A manual run on the release's TAG (Actions, "Mac update", Run workflow, Use workflow from: Tags, v0.1.9, and the same
# tag as the input), and the one mac-build.yml's `publish` job starts once it has added the notarised image to the
# release. A release's own workflow (release.yml) builds Windows and Linux and writes the update feed, latest.json,
# before a Mac image exists; the image is made and notarised later, by mac-build.yml, where the Developer ID is. This
# run takes that image and adds the Mac to the release's feed:
#
#   oaiy-desktop-<v>-macos-arm64.app.tar.gz          the app out of the release's image, its notarisation ticket stapled
#                                                    to it, packed the way the updater unpacks it (the app at the top of
#                                                    a gzipped tar, no extended attributes and no ._ files, which would
#                                                    break its sealed signature)
#   oaiy-desktop-<v>-macos-arm64.app.tar.gz.sig      its minisign signature, made with the updater key, for the name
#                                                    OAIY_<v>_aarch64.app.tar.gz (the desktop holds a signature to its
#                                                    version by the name it was made for; the bundler's own name for
#                                                    the archive, OAIY.app.tar.gz, has no version)
#   oaiy-desktop-<v>-macos-arm64.app.tar.gz.sha256   its checksum
#   latest.json                                      REPLACED: the same feed with a darwin-aarch64 entry added, every
#                                                    other entry as it was (platform/scripts/add-mac-update.mjs)
#   SHA256SUMS.txt                                   REPLACED: latest.json's new checksum, and the image, the packed
#                                                    app and its .sig added, so it is true again (the .sha256 files hold
#                                                    the same digests, and are not listed)
#
# Three jobs, each given only what it needs. `pack` runs on a Mac with no secret: it takes the image by its exact name,
# holds it to its checksum (the release's .sha256 and GitHub's own digest), has Gatekeeper say it and the app in it
# are notarised and of the release's version, packs the app, and unpacks the archive the way the updater does to see
# that the app is still valid and notarised when it comes out. `sign` runs in the `release` environment (the updater
# key; tags only, a reviewer approves), as release.yml's `sign` job does, and signs that archive, held to the digest
# `pack` recorded, and nothing else. `publish` adds the files, then the feed: the feed never names a file the release
# does not have yet.
#
# Replacing the feed is the one moment every installed OAIY can see, so it is made as short as it can be: the new feed and
# checksums go up beside the old under temporary names (latest.pending.json, SHA256SUMS.pending.txt), and then each old one
# is removed and the new one renamed to its name, two API calls, so the feed is missing between them and not for the length
# of an upload (and not for good when an upload fails, as `gh release upload --clobber`, which removes first, would leave
# it). Everything the run puts on the release is kept as the run's artifact first, with the feed and checksums it replaces.
#
# What the release has decides what a run does (add-mac-update.mjs --plan): its FEED, not its files. A release whose feed
# lists the Mac already is left alone, and the run fails before anything is made. A run that failed part way is finished
# by running it again: a packed app and its .sig that it uploaded are reused when they verify against the key (they cannot
# be replaced, and a new pack is not the same bytes), so the image is checked and the app compared again, and nothing is
# signed unless the .sig is not there yet; and a swap it was cut short in is completed.
#
# A copy of OAIY 0.1.8 or earlier never reads the Mac's entry (it does not update itself on a Mac at all): a Mac
# updates itself from the first release made after the one that taught it how, onwards.
name: Mac update

on:
  workflow_dispatch:
    inputs:
      release:
        description: "A published release's tag (v0.1.9) whose notarised image is attached. Run this on that tag (Use workflow from: Tags)."
        required: true

# Nothing may write by default; `publish` says so for itself.
permissions:
  contents: read

concurrency:
  group: mac-update-${{ inputs.release }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  pack:
    name: Pack the notarised app
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      reuse_sig: ${{ steps.plan.outputs.reuse_sig }}
      swap: ${{ steps.plan.outputs.swap }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The release, and this run on its tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          tag='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$RELEASE" =~ $tag ]] || { echo "::error::'$RELEASE' is not a release's tag (v0.1.9)"; exit 1; }
          # The updater key is given only to a run on a release's tag (the release environment's rule), so the run must be on this one.
          [ "$GITHUB_REF" = "refs/tags/$RELEASE" ] || { echo "::error::run this on the tag $RELEASE (Use workflow from: Tags, $RELEASE), not on $GITHUB_REF"; exit 1; }
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE" --jq .sha)"
          [ "$tagged" = "$GITHUB_SHA" ] || { echo "::error::$RELEASE is commit $tagged, and this run is on $GITHUB_SHA"; exit 1; }
          draft="$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" || { echo "::error::there is no release $RELEASE"; exit 1; }
          [ "$draft" = false ] || { echo "::error::the release $RELEASE is a draft"; exit 1; }
          version="${RELEASE#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # From the release's feed (and the files an earlier run may have left): make the Mac's update, reusing what such a run
      # uploaded, or finish the swap it was cut short in, or nothing at all when the feed lists the Mac already.
      - name: What this run does to the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          dir="mac-update/release"
          mkdir -p "$dir"
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$dir/assets.txt"
          plan=(--plan --version "$VERSION" --assets "$dir/assets.txt")
          if grep -qxF latest.json "$dir/assets.txt"; then
            gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" -D "$dir" -p latest.json
            plan+=(--feed "$dir/latest.json")
          fi
          if grep -qxF latest.pending.json "$dir/assets.txt"; then
            gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" -D "$dir" -p latest.pending.json
            plan+=(--pending-feed "$dir/latest.pending.json")
          fi
          said="$(node platform/scripts/add-mac-update.mjs "${plan[@]}")"
          echo "$said"
          grep -qxE 'mode=(make|finish)' <<< "$said" || { echo "::error::add-mac-update.mjs --plan named no mode"; exit 1; }
          echo "$said" >> "$GITHUB_OUTPUT"

      - name: The image, held to its checksum
        if: steps.plan.outputs.mode == 'make'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image="oaiy-desktop-$VERSION-macos-arm64.dmg"
          dir="mac-update/image"
          mkdir -p "$dir"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" -D "$dir" -p "$image" -p "$image.sha256"
          [ "$(ls "$dir" | wc -l | tr -d ' ')" = 2 ] || { echo "::error::expected the image and its .sha256, found: $(ls "$dir")"; exit 1; }
          got="$(shasum -a 256 "$dir/$image" | cut -d' ' -f1)"
          said="$(cut -d' ' -f1 "$dir/$image.sha256")"
          github="$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$image\") | .digest")"
          [ "$got" = "$said" ] || { echo "::error::$image is $got and its .sha256 says $said"; exit 1; }
          [ "sha256:$got" = "$github" ] || { echo "::error::$image is $got and GitHub's digest of it is $github"; exit 1; }
          echo "IMAGE=$dir/$image" >> "$GITHUB_ENV"
          echo "IMAGE_SHA256=$got" >> "$GITHUB_ENV"

      # What macOS says of the image and the app, and the app's version: the one the release is.
      - name: The app, notarised and of this version
        if: steps.plan.outputs.mode == 'make'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          notarised() { grep -qx 'source=Notarized Developer ID' <<< "$1" || { echo "$1"; echo "::error::$2 is not notarised (Gatekeeper says the above)"; exit 1; }; }
          notarised "$(spctl --assess --type open --context context:primary-signature -vv "$IMAGE" 2>&1)" "the image"
          mount="$RUNNER_TEMP/image"; stage="$RUNNER_TEMP/stage"; mkdir -p "$stage"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$IMAGE" > /dev/null
          ditto "$mount/OAIY.app" "$stage/OAIY.app"
          hdiutil detach "$mount" > /dev/null
          app="$stage/OAIY.app"
          shown="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [ "$shown" = "$VERSION" ] || { echo "::error::the app in the image is version $shown, not $VERSION"; exit 1; }
          codesign --verify --deep --strict "$app"
          notarised "$(spctl --assess --type execute -vv "$app" 2>&1)" "the app in the image"
          # The ticket in the app itself (the image's is stapled to the image): an app that is moved out of its image keeps it.
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      # A packed app (and its .sig) that an earlier run of this release put on it and then failed: it cannot be replaced,
      # so it is what this run checks and the feed names. Its .sig is held to the key every installed OAIY carries before
      # it is trusted, and the app in it is checked below as a new pack would be.
      - name: The Mac files an earlier run left on the release
        if: steps.plan.outputs.mode == 'make' && steps.plan.outputs.reuse_app == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ steps.release.outputs.version }}
          REUSE_SIG: ${{ steps.plan.outputs.reuse_sig }}
        run: |
          set -euo pipefail
          asset="oaiy-desktop-$VERSION-macos-arm64.app.tar.gz"
          reused="mac-update/reused"
          mkdir -p "$reused" mac-update/packed mac-update/signature
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" -D "$reused" -p "$asset"
          if [ "$REUSE_SIG" = true ]; then
            gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" -D "$reused" -p "$asset.sig"
            node platform/scripts/add-mac-update.mjs --check --dir "$reused" --version "$VERSION" --conf platform/desktop/src-tauri/tauri.conf.json
            cp "$reused/$asset.sig" mac-update/signature/
          fi
          cp "$reused/$asset" mac-update/packed/
          echo "Reusing the release's $asset$([ "$REUSE_SIG" = true ] && echo ' and its .sig')" >> "$GITHUB_STEP_SUMMARY"

      - name: Pack it as the updater unpacks it
        id: pack
        if: steps.plan.outputs.mode == 'make'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REUSE_APP: ${{ steps.plan.outputs.reuse_app }}
        run: |
          set -euo pipefail
          asset="oaiy-desktop-$VERSION-macos-arm64.app.tar.gz"
          out="mac-update/packed"
          mkdir -p "$out"
          if [ "$REUSE_APP" != true ]; then
            # The app at the top, and nothing of the Mac's own beside its files: no extended attributes, no ._ files
            # (COPYFILE_DISABLE), no ACLs or flags. The updater unpacks every entry as a file of the app, so a ._ file
            # would be one more file in a sealed bundle, and the app would no longer start.
            COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs --no-acls --no-fflags -czf "$out/$asset" -C "$(dirname "$APP")" OAIY.app
          fi
          # tauri-plugin-updater 2.12 (update::gui) drops every entry's first part and unpacks the rest into one folder,
          # which it then puts where the app was. The same here, then what macOS says of the result.
          check="$RUNNER_TEMP/unpacked"
          python3 -I - "$out/$asset" "$check/OAIY.app" <<'EOF'
          import os, sys, tarfile
          from pathlib import PurePosixPath
          archive, dest = sys.argv[1], sys.argv[2]
          os.makedirs(dest)
          tops = set()
          with tarfile.open(archive, "r:gz") as tar:
              for m in tar:
                  parts = PurePosixPath(m.name).parts
                  if PurePosixPath(m.name).is_absolute() or ".." in parts:
                      sys.exit(f"::error::the archive has an entry outside the app: {m.name}")
                  if any(p.startswith("._") for p in parts):
                      sys.exit(f"::error::the archive has a ._ file, which would break the app's signature: {m.name}")
                  tops.add(parts[0])
                  target = os.path.join(dest, *parts[1:])
                  if m.isdir():
                      os.makedirs(target, exist_ok=True)
                  elif m.isfile():
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with tar.extractfile(m) as src, open(target, "wb") as out:
                          while chunk := src.read(1 << 20):
                              out.write(chunk)
                      os.chmod(target, m.mode & 0o777)
                  elif m.issym():
                      os.symlink(m.linkname, target)
                  else:
                      sys.exit(f"::error::the archive has an entry of a kind the updater does not unpack: {m.name}")
          if tops != {"OAIY.app"}:
              sys.exit(f"::error::the archive's top is {sorted(tops)}, not OAIY.app")
          EOF
          codesign --verify --deep --strict --verbose=2 "$check/OAIY.app"
          said="$(spctl --assess --type execute -vv "$check/OAIY.app" 2>&1)"
          grep -qx 'source=Notarized Developer ID' <<< "$said" || { echo "$said"; echo "::error::the app as the updater unpacks it is not accepted as notarised"; exit 1; }
          xcrun stapler validate "$check/OAIY.app"
          if [ "$REUSE_APP" = true ]; then
            # The app the earlier run packed had its ticket stapled then (Contents/CodeResources), and one fetched again
            # need not be the same bytes: that file alone may differ from the app just stapled here.
            ticket="Files $APP/Contents/CodeResources and $check/OAIY.app/Contents/CodeResources differ"
            differ="$(diff -rq "$APP" "$check/OAIY.app" | grep -vxF "$ticket" || true)"
            [ -z "$differ" ] || { echo "$differ"; echo "::error::the release's $asset is not the app of its image: delete it (and its .sig and .sha256), then run this again"; exit 1; }
          else
            diff -r "$APP" "$check/OAIY.app"
          fi
          ls -l "$out"
          sha="$(shasum -a 256 "$out/$asset" | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "## $asset" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 \`$sha\`, from the image \`$IMAGE_SHA256\`: unpacked as the updater does, it is the notarised app" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.plan.outputs.mode == 'make'
        with:
          name: mac-update
          path: mac-update/packed/
          if-no-files-found: error
          retention-days: 7
      # The reused .sig, under the name the signing job gives its own (which does not run then): nothing new is signed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.plan.outputs.mode == 'make' && steps.plan.outputs.reuse_sig == 'true'
        with:
          name: mac-update-signature
          path: mac-update/signature/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- signing
  # The updater key, as release.yml's `sign` job uses it: in the `release` environment (tags only, a reviewer approves),
  # with the Tauri CLI from the desktop app's lockfile and no install scripts, signing what `pack` made and nothing else.
  # Not run (and so not approved) when there is nothing to sign: a run that finishes an earlier one's swap, or reuses the
  # .sig that run uploaded.
  sign:
    name: Sign the Mac update
    needs: pack
    if: needs.pack.outputs.mode == 'make' && needs.pack.outputs.reuse_sig != 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac-update
          path: artifacts/mac

      - name: Install the Tauri CLI
        working-directory: platform/desktop
        run: npm ci --ignore-scripts

      - name: Sign the packed app
        shell: bash
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          PACKED_SHA256: ${{ needs.pack.outputs.sha256 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # (A secret set from a file can end in a newline, which the Tauri CLI refuses: see release.yml's sign job.)
          key="$TAURI_SIGNING_PRIVATE_KEY"
          while [[ "$key" == *$'\n' || "$key" == *$'\r' ]]; do key="${key%$'\n'}"; key="${key%$'\r'}"; done
          password="$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          while [[ "$password" == *$'\n' || "$password" == *$'\r' ]]; do password="${password%$'\n'}"; password="${password%$'\r'}"; done
          missing=""
          [[ -n "$key" ]] || missing="TAURI_SIGNING_PRIVATE_KEY"
          [[ -n "$password" ]] || missing="${missing:+$missing and }TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [[ -n "$missing" ]]; then
            echo "::error::the secret $missing is not set in the release environment (Settings, Environments, release). See docs/RELEASING.md, The updater key."
            exit 1
          fi
          export TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$password"
          asset="oaiy-desktop-$VERSION-macos-arm64.app.tar.gz"
          signed_as="OAIY_${VERSION}_aarch64.app.tar.gz"
          dir="$GITHUB_WORKSPACE/artifacts/mac"; work="$RUNNER_TEMP/signing"; out="$GITHUB_WORKSPACE/signatures"
          mkdir -p "$work" "$out"
          [[ "$PACKED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the pack job recorded no digest, so nothing is signed"; exit 1; }
          [[ -s "$dir/$asset" ]] || { echo "::error::$asset is not in the pack job's artifact"; exit 1; }
          actual="$(sha256sum "$dir/$asset" | cut -d' ' -f1)"
          [[ "$actual" == "$PACKED_SHA256" ]] || { echo "::error::$asset is $actual, and the pack job recorded $PACKED_SHA256"; exit 1; }
          extra="$(find "$dir" -type f ! -name "$asset")"
          [[ -z "$extra" ]] || { echo "::error::the pack job's artifact holds ${extra%%$'\n'*} beside $asset: nothing but the packed app is signed"; exit 1; }
          cp "$dir/$asset" "$work/$signed_as"
          "$GITHUB_WORKSPACE/platform/desktop/node_modules/.bin/tauri" signer sign "$work/$signed_as" >/dev/null
          [[ -s "$work/$signed_as.sig" ]] || { echo "::error::tauri signer sign made no signature for $asset"; exit 1; }
          cp "$work/$signed_as.sig" "$out/$asset.sig"
          ls -l "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-update-signature
          path: signatures/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- release
  # The files, then the feed. The feed is read back from the release and the Mac's entry added to it by a script with
  # tests, which checks the signature against the key in tauri.conf.json (the key every installed OAIY carries) and what
  # it was made for, and keeps every other entry exactly; the checksums are made true again beside it. Then the two are
  # swapped in (see the top of this file), and read back as a Mac reads them.
  publish:
    name: Add the Mac update to the release
    needs: [pack, sign]
    # (sign is skipped when this run reuses a .sig or only finishes a swap)
    if: ${{ !cancelled() && needs.pack.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.pack.outputs.mode == 'make'
        with:
          name: mac-update
          path: mac-update/files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.pack.outputs.mode == 'make'
        with:
          name: mac-update-signature
          path: mac-update/files

      - name: The feed with the Mac in it, and the checksums
        if: needs.pack.outputs.mode == 'make'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ needs.pack.outputs.version }}
          PACKED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          asset="oaiy-desktop-$VERSION-macos-arm64.app.tar.gz"
          image="oaiy-desktop-$VERSION-macos-arm64.dmg"
          files="mac-update/files"
          got="$(sha256sum "$files/$asset" | cut -d' ' -f1)"
          [ "$got" = "$PACKED_SHA256" ] || { echo "::error::$asset is $got, and the pack job recorded $PACKED_SHA256"; exit 1; }
          ( cd "$files" && sha256sum "$asset" > "$asset.sha256" && cat "$asset.sha256" )
          mkdir -p release
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" -D release -p latest.json -p SHA256SUMS.txt -p "$image.sha256"
          node platform/scripts/add-mac-update.mjs --feed release/latest.json --sums release/SHA256SUMS.txt --dir "$files" \
            --version "$VERSION" --tag "$RELEASE" --repo "$GITHUB_REPOSITORY" --conf platform/desktop/src-tauri/tauri.conf.json \
            --image-sha256 "$(cut -d' ' -f1 "release/$image.sha256")" --out mac-update/new
          diff release/latest.json mac-update/new/latest.json || true
          diff release/SHA256SUMS.txt mac-update/new/SHA256SUMS.txt || true
          # Under the names they go up as first, beside the release's own.
          mkdir -p mac-update/pending
          cp mac-update/new/latest.json mac-update/pending/latest.pending.json
          cp mac-update/new/SHA256SUMS.txt mac-update/pending/SHA256SUMS.pending.txt

      # Kept before anything is put on the release: if the run stops half way, what it was putting there (and what it was
      # replacing) is here to finish it by hand.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.pack.outputs.mode == 'make'
        with:
          name: mac-update-release
          path: |
            mac-update/files/
            mac-update/new/
            release/
          if-no-files-found: error
          retention-days: 30

      - name: Add the Mac's files to the release
        if: needs.pack.outputs.mode == 'make'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          asset="oaiy-desktop-$VERSION-macos-arm64.app.tar.gz"
          files="mac-update/files"
          # With no --clobber (a file a release has already is never replaced), and before the feed that names them: a Mac
          # never reads an entry for a file that is not there. One an earlier run uploaded stays, and must be this run's.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '.assets[] | "\(.name)\t\(.digest)"' > mac-update/on-release.tsv
          for name in "$asset" "$asset.sig" "$asset.sha256"; do
            ours="sha256:$(sha256sum "$files/$name" | cut -d' ' -f1)"
            theirs="$(awk -F'\t' -v n="$name" '$1 == n { print $2 }' mac-update/on-release.tsv)"
            if [ -z "$theirs" ]; then
              gh release upload "$RELEASE" "$files/$name" --repo "$GITHUB_REPOSITORY"
            elif [ "$theirs" = "$ours" ]; then
              echo "$name is on the release already, the same file"
            else
              echo "::error::the release's $name ($theirs) is not this run's ($ours): delete the Mac's .app.tar.gz, .sig and .sha256 from the release, then run this again"; exit 1
            fi
          done

      - name: Put the new feed and checksums up beside the old
        if: needs.pack.outputs.mode == 'make'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          # (one an earlier run put up and never swapped in is made again: only this workflow writes these names)
          for pending in latest.pending.json SHA256SUMS.pending.txt; do
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq ".assets[] | select(.name == \"$pending\") | .id")"
            [ -z "$id" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done
          gh release upload "$RELEASE" mac-update/pending/latest.pending.json mac-update/pending/SHA256SUMS.pending.txt --repo "$GITHUB_REPOSITORY"

      # Each old one removed and its new one renamed to its name: between the two calls the release has no such file, and
      # that is the only moment it has none. The rename is tried again a few times; if it still fails, running this
      # workflow again finishes it (it sees the pending file, and only renames).
      - name: Swap them in
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          SWAP: ${{ needs.pack.outputs.swap }}
        run: |
          set -euo pipefail
          asset_id() { gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq ".assets[] | select(.name == \"$1\") | .id"; }
          for name in $SWAP; do
            case "$name" in
              latest.json) pending=latest.pending.json ;;
              SHA256SUMS.txt) pending=SHA256SUMS.pending.txt ;;
              *) echo "::error::the pack job named $name to swap in, which is not one this workflow replaces"; exit 1 ;;
            esac
            new="$(asset_id "$pending")"
            [ -n "$new" ] || { echo "::error::the release has no $pending to put in place of $name"; exit 1; }
            old="$(asset_id "$name")"
            [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            renamed=no
            for wait in 0 2 5 10 20; do
              sleep "$wait"
              if gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new" -f name="$name" > /dev/null; then renamed=yes; break; fi
            done
            [ "$renamed" = yes ] || { echo "::error::$name is not on the release: its new copy is there as $pending. Run this workflow again on $RELEASE, which renames it, or: gh api -X PATCH repos/$GITHUB_REPOSITORY/releases/assets/$new -f name=$name"; exit 1; }
            echo "$name swapped in"
          done

      - name: Read it back as a Mac reads it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          MODE: ${{ needs.pack.outputs.mode }}
        run: |
          set -euo pipefail
          back="mac-update/back"
          mkdir -p "$back"
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" -D "$back" -p latest.json -p SHA256SUMS.txt
          if [ "$MODE" = make ]; then
            cmp "$back/latest.json" mac-update/new/latest.json
            cmp "$back/SHA256SUMS.txt" mac-update/new/SHA256SUMS.txt
          fi
          listed="$(node -p 'Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).platforms).join(", ")' "$back/latest.json")"
          [[ "$listed" == *darwin-aarch64* ]] || { echo "::error::the feed on the release does not list the Mac: $listed"; exit 1; }
          feed="$(sha256sum "$back/latest.json" | cut -d' ' -f1)"
          grep -qxF "$feed  latest.json" "$back/SHA256SUMS.txt" || { echo "::error::SHA256SUMS.txt on the release does not give latest.json its digest ($feed)"; exit 1; }
          left="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '.assets[] | select(.name == "latest.pending.json" or .name == "SHA256SUMS.pending.txt") | .name')"
          [ -z "$left" ] || { echo "::error::the release still has $left"; exit 1; }
          echo "## The Mac update is on $RELEASE" >> "$GITHUB_STEP_SUMMARY"
          echo "latest.json lists $listed$([ "$MODE" = finish ] && echo ' (this run finished the swap an earlier one was cut short in)')" >> "$GITHUB_STEP_SUMMARY"
