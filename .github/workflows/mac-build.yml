# Mac build: OAIY Desktop for an Apple-silicon Mac, as a disk image, made on demand.
#
# A manual run only (Actions, "Mac build", Run workflow): nothing starts it by itself, a push or a tag least of all.
# It builds what the release workflow's `desktop` job builds, step for step, on a macOS runner, because a .dmg can
# only be made on a Mac: the bundler needs macOS's own tools. The run uploads the disk image and the headless server
# for a Mac as its artifacts and does nothing else: it publishes no release, pushes no tag, and is given no secret
# (no updater key, no signing certificate).
#
# The build signs the app ad hoc (tauri.conf.json, bundle.macOS.signingIdentity "-"): a signature an Apple-silicon
# Mac will run, with no Apple Developer ID behind it, which macOS asks about before it opens it the first time
# (docs/MAC.md says what to click). The builds are given no secret.
#
# The job `sign` then signs that app with the repository's Developer ID and has Apple notarise it, so that a Mac
# opens it like any app. It runs only when the repository says it has the identity (the variable MAC_SIGNING is
# `on`), in the environment `mac-signing`, which holds the certificate and the notary's key and whose every use the
# repository's owner approves. It is the only job that is given them, and it runs Apple's own tools and nothing of
# the project's: the jobs that build run the project's npm packages and crates, and see no secret.
#
# Before the upload's last word, the image is used as a person uses it: opened, the app copied out of it, started,
# and a flow run through it (platform/desktop/scripts/smoke-desktop.mjs). The artifacts are uploaded first, so a
# run whose app does not start still leaves the image to look at.
name: Mac build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp, above the last release (0.1.2 is out: 0.1.3-mac.1)'
        required: true
        default: '0.1.3-mac.1'
      what:
        description: 'all: the image (and its signing) and the engine asked one question on the GPU. engine: no image, and a long prompt to the engine too (an hour). webkit: only what WebKit isolates a page for.'
        type: choice
        options: [all, engine, webkit]
        default: all

# Nothing may write: the run builds and uploads its own artifacts.
permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # The engine the image carries, on a Mac's GPU, beside the build and not in its way. Each kernel is compiled by
  # Apple's own compiler the first time it runs, and only there: a kernel naga writes for Metal in a way that
  # compiler refuses ends the language-model server on every Mac, and nothing short of running it on one shows it
  # (the first image did exactly that: "redefinition of 'reinterpreted_packed_char4_e1455'"). Two looks: a model
  # of the catalog asked one question, and the GPU backend's own tests, each kernel's results held against the CPU's.
  engine:
    name: The engine on a Mac's GPU (Apple's compiler)
    if: ${{ inputs.what != 'webkit' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned revision)

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: engine-on-metal

      - name: The Mac and its GPU
        run: |
          sw_vers | tr '\n' ' '; echo
          sysctl -n machdep.cpu.brand_string; echo "memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB"
          system_profiler SPDisplaysDataType | head -24

      - name: Build the portable language-model engine
        run: cargo build --release --locked -p oaiy-llm-server --no-default-features --features webgpu --bin oaiy-llm-server-webgpu

      # The catalog's small language model (crates/oaiy-studio/src/catalog.json, qwen3.5-4b): the same family and
      # the same kind of file as the model the setup wizard recommends, so the same kernels.
      - name: Fetch the catalog's small language model
        run: curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/Qwen3.5-4B-Q4_K_M.gguf" https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf

      - name: One question to the model, on the GPU
        env:
          ENGINE_SMOKE_NEEDS_GPU: '1'
        run: sh tools/engine-smoke.sh target/release/oaiy-llm-server-webgpu "$RUNNER_TEMP/Qwen3.5-4B-Q4_K_M.gguf"

      # What an agent sends is thousands of tokens of instructions, and a prompt that long is read by other kernels
      # than a short one (in blocks of rows, chained on the GPU). On the first Mac the Agent answered such a prompt
      # with one syllable over and over. Asked both ways, so that the run says which path is wrong: as the engine
      # runs by default, and with its chained runs off (OAIY_NO_CHAIN), each kernel then an operation of its own.
      # Only when the run is for the engine alone (`what: engine`): on this runner's virtual GPU a prompt of that
      # length takes most of an hour, which a run that makes an image should not spend. A Mac with a GPU of its
      # own answers it in a minute: `ENGINE_SMOKE_LONG=1 sh tools/engine-smoke.sh ...` there (docs/MAC.md).
      - name: A long prompt to the model, on the GPU
        if: ${{ !cancelled() && inputs.what == 'engine' }}
        continue-on-error: true
        env:
          ENGINE_SMOKE_NEEDS_GPU: '1'
          ENGINE_SMOKE_LONG: '1'
          ENGINE_SMOKE_LONG_LINES: '120'
        run: sh tools/engine-smoke.sh target/release/oaiy-llm-server-webgpu "$RUNNER_TEMP/Qwen3.5-4B-Q4_K_M.gguf"

      - name: The same long prompt with the chained runs off
        if: ${{ !cancelled() && inputs.what == 'engine' }}
        continue-on-error: true
        env:
          ENGINE_SMOKE_NEEDS_GPU: '1'
          ENGINE_SMOKE_LONG: '1'
          ENGINE_SMOKE_LONG_LINES: '120'
          OAIY_NO_CHAIN: '1'
        run: sh tools/engine-smoke.sh target/release/oaiy-llm-server-webgpu "$RUNNER_TEMP/Qwen3.5-4B-Q4_K_M.gguf"

      # Told, and not yet held to: on this runner (an Apple M1 that is a virtual machine, with a virtual GPU) 25 of
      # these 97 tests gave other numbers than the CPU the first time the step ran (f16 and tiled matmuls, the media
      # models' convolutions, grouped experts, Q2_0), while the model above answered in sentences. Whether a Mac's
      # own GPU gives them is not known. Until it is, the job is held to the model's answer, and what the tests
      # said is in the step's text and in the run's artifact (oaiy-mac-check.txt).
      - name: The GPU backend's own tests, on the GPU
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: sh tools/mac/check.sh

      - name: Keep what the server and the tests said
        if: ${{ !cancelled() }}
        run: |
          mkdir -p engine-said
          for file in oaiy-engine-smoke.txt oaiy-mac-check.txt; do
            [ -f "${TMPDIR:-/tmp}/$file" ] && cp "${TMPDIR:-/tmp}/$file" engine-said/ || true
          done
          ls -la engine-said

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: engine-on-metal
          path: engine-said/
          if-no-files-found: warn
          retention-days: 30

  # What a Mac's webview needs before it calls a page cross-origin isolated (the Agent's code sandbox): a page on a
  # scheme of its own, as the window serves the Agent's, under each embedder policy, and the same page from a local
  # server. A job of its own, and only when asked for (`what: webkit`): the same two files answer it on any Mac in
  # a minute (docs/MAC.md), which is the better place to ask.
  webkit:
    name: What WebKit isolates a page for
    if: ${{ inputs.what == 'webkit' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Ask WebKit
        run: |
          sw_vers | tr '\n' ' '; echo
          swiftc tools/mac/webview-probe.swift -o "$RUNNER_TEMP/webview-probe"
          python3 tools/mac/isolated-page-server.py 18477 require-corp &
          python3 tools/mac/isolated-page-server.py 18478 credentialless &
          sleep 2
          "$RUNNER_TEMP/webview-probe" http://127.0.0.1:18477/ http://127.0.0.1:18478/ http://localhost:18477/ || true
          kill %1 %2 2> /dev/null || true

  dmg:
    name: OAIY Desktop (.dmg, Apple silicon)
    if: ${{ inputs.what == 'all' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the ZIPP release
        run: node platform/scripts/fetch-zipp-release.mjs --ensure

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned revision)

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            platform/desktop/src-tauri
            . -> target

      - name: Stamp the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs"); const v = process.argv[1];
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/.test(v)) { console.error("not a version: " + v); process.exit(1); }
            const conf = "platform/desktop/src-tauri/tauri.conf.json";
            const j = JSON.parse(fs.readFileSync(conf, "utf8")); j.version = v;
            fs.writeFileSync(conf, JSON.stringify(j, null, 2) + "\n");
            const toml = "platform/desktop/src-tauri/Cargo.toml";
            fs.writeFileSync(toml, fs.readFileSync(toml, "utf8").replace(/^version = "[^"]+"/m, `version = "${v}"`));
            console.log("stamped", v);
          ' "$VERSION"

      - name: Install and build the CLI
        working-directory: platform/cli
        run: |
          npm ci
          npm run build

      - name: Check CLI HTTPS shutdown
        working-directory: platform/cli
        run: node test/cli-http-exit.mjs

      # The Agent pins its own ZIPP (release.yml says why the pair is cleared for it).
      - name: Install and build the Agent
        working-directory: app
        env:
          ZIPP_RELEASE: ''
          ZIPP_SUMS_SHA256: ''
        run: |
          npm ci
          npm run build:desktop

      - name: Install and build the flow editor
        working-directory: platform/ui
        run: |
          npm ci
          npm run build

      - name: Install the desktop app's dependencies
        working-directory: platform/desktop
        run: npm ci

      # The engine the app carries: on a Mac its GPU is Metal's, through WebGPU.
      - name: Build the portable language-model engine
        run: cargo build --release --locked -p oaiy-llm-server --no-default-features --features webgpu --bin oaiy-llm-server-webgpu

      - name: Build OAIY Desktop
        working-directory: platform/desktop
        run: npm run tauri:build -- --bundles app,dmg

      - name: Build the headless server
        working-directory: platform/desktop/src-tauri
        run: cargo build --release --no-default-features --features web --bin oaiy-server

      - name: Stage complete headless distribution
        run: node platform/desktop/scripts/package-server.mjs platform/desktop/src-tauri/target/release/oaiy-server headless-dist

      - name: Execute a flow from the headless distribution
        run: node platform/desktop/scripts/smoke-server.mjs headless-dist

      - name: Collect
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          out="$PWD/release"; mkdir -p "$out"
          bundle=platform/desktop/src-tauri/target/release/bundle
          dmg="$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' | head -1)"
          [ -n "$dmg" ] || { echo "::error::no .dmg was built"; exit 1; }
          cp "$dmg" "$out/oaiy-desktop-$VERSION-macos-arm64.dmg"
          tar -C headless-dist -czf "$out/oaiy-server-$VERSION-macos-arm64.tar.gz" .
          ( cd "$out" && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          echo "::notice::the app is signed ad hoc and is not notarised: macOS asks before it opens it the first time (docs/MAC.md)."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oaiy-macos-arm64
          path: release/
          if-no-files-found: error
          retention-days: 30

      # The image as a person uses it: opened, the app dragged out (here: copied to a folder of the run's), the image
      # put away, the app started from where it now is. Its signature is checked first: one that does not hold is an
      # app macOS will not start on Apple silicon. The app is started as on a Mac with no Node (SMOKE_OWN_NODE):
      # it has to fetch and unpack its own, as it will on the Mac this image is for.
      - name: Run a flow in the app from the disk image
        env:
          SMOKE_OWN_NODE: '1'
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/oaiy-dmg"; apps="$RUNNER_TEMP/Applications"; mkdir -p "$apps"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" release/*.dmg
          ls -la "$mount"
          cp -R "$mount/OAIY.app" "$apps/"
          hdiutil detach "$mount"
          codesign --verify --deep --strict --verbose=2 "$apps/OAIY.app"
          codesign -dv --verbose=2 "$apps/OAIY.app" 2>&1 | head -14
          find "$apps/OAIY.app/Contents" -type f -perm +111 | head -40
          node platform/desktop/scripts/smoke-desktop.mjs "$apps/OAIY.app/Contents/MacOS/oaiy-desktop"

      # Pictures of the sections whose pages are webviews of their own laid over the window (Engines, Flows, the
      # Agent): where such a page lands in the window is a thing to look at, and nobody sits at this Mac. The app
      # is started in a home folder of the step's own and told which section to open (OAIY_START_VIEW).
      - name: Pictures of the sections that are pages of their own
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p screens
          app="$RUNNER_TEMP/Applications/OAIY.app/Contents/MacOS/oaiy-desktop"
          for view in engines flows agent; do
            home="$RUNNER_TEMP/home-$view"; mkdir -p "$home"
            HOME="$home" OAIY_START_VIEW="$view" "$app" > "screens/$view.log" 2>&1 &
            pid=$!
            sleep 45
            screencapture -x "screens/$view.png" || echo "no picture of $view"
            kill "$pid" 2> /dev/null || true
            sleep 5
            # Where the window put the page, against where the dashboard asked for it (embed.rs, `note_placement`).
            cp "$home/Library/Application Support/com.oaiy.app/logs/oaiy-desktop.log" "screens/$view-desktop.log" 2> /dev/null || echo "no log of $view"
            grep -h "embed: " "screens/$view-desktop.log" 2> /dev/null || echo "nothing was placed for $view"
          done
          ls -la screens

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: mac-screens
          path: screens/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- sign
  # The image the job above made, signed with the Developer ID and notarised. Every program inside the app is
  # signed first (the engine and the headless server are programs of their own, and Apple's notary refuses an app
  # with one that is not signed with the hardened runtime and a timestamp), then the app with its entitlements, then
  # a new image of it. With the notary's key the image is sent to Apple, waited for, and has its ticket stapled on;
  # without it the image is signed and says so. The app is then started from the signed image and a flow run
  # through it, as the build's own was.
  sign:
    name: Sign with the Developer ID and notarise
    needs: dmg
    if: ${{ vars.MAC_SIGNING == 'on' }}
    runs-on: macos-15
    environment: mac-signing
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oaiy-macos-arm64
          path: built

      - name: Sign the app and make its image
        env:
          VERSION: ${{ inputs.version }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] || { echo "::error::the environment mac-signing has no certificate"; exit 1; }
          # A keychain of this job's own, for the certificate and its key; gone with the runner.
          keychain="$RUNNER_TEMP/oaiy-signing.keychain-db"
          key="$(openssl rand -base64 24)"
          security create-keychain -p "$key" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$key" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
          : > "$RUNNER_TEMP/developer-id.p12"
          # Apple's intermediate for Developer ID certificates of the G2 kind, in case the runner has not got it.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" > /dev/null 2>&1 || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$key" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "identities for signing code in the job's keychain: $(security find-identity -v -p codesigning "$keychain" | grep -c 'Developer ID Application')"

          # The app, out of the image the build made.
          mount="$RUNNER_TEMP/built-image"; stage="$RUNNER_TEMP/stage"; mkdir -p "$stage"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" built/*.dmg > /dev/null
          cp -R "$mount/OAIY.app" "$stage/"
          hdiutil detach "$mount" > /dev/null
          app="$stage/OAIY.app"

          # Inside out: each program that is not the app's own first, then the app.
          main="$app/Contents/MacOS/oaiy-desktop"
          find "$app/Contents" -type f -print0 | while IFS= read -r -d '' file; do
            [ "$file" = "$main" ] && continue
            if file -b "$file" | grep -q 'Mach-O'; then
              echo "signing ${file#$app/}"
              codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" --keychain "$keychain" "$file"
            fi
          done
          codesign --force --timestamp --options runtime --entitlements platform/desktop/src-tauri/entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" --keychain "$keychain" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier|Timestamp|Runtime|CodeDirectory)" || true

          # A new image: the app, and the way to Applications beside it.
          mkdir -p signed
          ln -s /Applications "$stage/Applications"
          image="signed/oaiy-desktop-$VERSION-macos-arm64.dmg"
          hdiutil create -volname "OAIY" -srcfolder "$stage" -ov -format UDZO "$image" > /dev/null
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$keychain" "$image"
          codesign --verify --verbose=2 "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Have Apple notarise the image
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::warning::the environment mac-signing has no notary key: the image is signed with the Developer ID and NOT notarised, so macOS still asks before it opens it the first time."
            echo "NOTARISED=no" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$IMAGE" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json" || true
          status="$(node -p 'try { JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).status } catch { "no answer" }' "$RUNNER_TEMP/notary.json")"
          id="$(node -p 'try { JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).id } catch { "" }' "$RUNNER_TEMP/notary.json")"
          echo "Apple's notary says: $status"
          if [ "$status" != "Accepted" ]; then
            # Why not, in Apple's words (which file, which rule).
            [ -n "$id" ] && xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" | head -80 || true
            : > "$RUNNER_TEMP/notary.p8"
            echo "::error::Apple did not notarise the image ($status)"
            exit 1
          fi
          : > "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$IMAGE"
          xcrun stapler validate "$IMAGE"
          echo "NOTARISED=yes" >> "$GITHUB_ENV"

      # What macOS itself will say of it on a Mac, and the signed app used as the build's was.
      - name: What Gatekeeper says, and a flow in the signed app
        env:
          SMOKE_OWN_NODE: '1'
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/signed-image"; apps="$RUNNER_TEMP/Applications"; mkdir -p "$apps"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$IMAGE" > /dev/null
          cp -R "$mount/OAIY.app" "$apps/"
          hdiutil detach "$mount" > /dev/null
          codesign --verify --deep --strict "$apps/OAIY.app"
          if [ "$NOTARISED" = yes ]; then
            spctl --assess --type open --context context:primary-signature -vv "$IMAGE"
            spctl --assess --type execute -vv "$apps/OAIY.app"
          else
            spctl --assess --type execute -vv "$apps/OAIY.app" || echo "(as expected of an app that is not notarised)"
          fi
          node platform/desktop/scripts/smoke-desktop.mjs "$apps/OAIY.app/Contents/MacOS/oaiy-desktop"
          ( cd signed && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oaiy-macos-arm64-signed
          path: signed/
          if-no-files-found: error
          retention-days: 30
