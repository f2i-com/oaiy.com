[package]
name = "oaiy-desktop"
version = "0.1.0"
description = "Tray-resident OAIY Desktop for oaiy-web. Manages local AI services + browser automation, exposes them to the web flow editor via a localhost API."
authors = ["OAIY"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"
# The crate ships two binaries now (the GUI app + the headless oaiy-server),
# so `cargo run` / `tauri dev` would be ambiguous without naming the default.
default-run = "oaiy-desktop"

[lib]
name = "oaiy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The crate builds two binaries from one shared lib:
#   oaiy-desktop — the Tauri GUI (needs the `gui` feature → tauri/webkit2gtk)
#   oaiy-server    — headless HTTP API (no GUI deps when built --no-default-features)
[features]
default = ["gui"]
custom-protocol = ["tauri/custom-protocol"]
gui = [
    "dep:tauri",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-updater",
    "dep:reqwest13",
    "dep:oaiy-studio",
    "dep:tauri-build",
]
# The browser login of `oaiy-server` (design 4.7): the Argon2id password, the strength estimate and
# the console. Enabled for the headless server and left off for the desktop, so the GUI carries the
# guard and the credential store but none of the login.
web = [
    "dep:argon2",
    "dep:unicode-normalization",
    "dep:zxcvbn",
    "dep:rpassword",
]

[[bin]]
name = "oaiy-desktop"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "oaiy-server"
path = "src/bin/oaiy-server.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [], optional = true }

[dependencies]
# Tauri 2.x with tray-icon support — GUI only, so optional behind `gui`.
# `unstable`: a window with several webviews (the agent and the flow editor beside the dashboard).
tauri = { version = "2.1", features = ["tray-icon", "unstable"], optional = true }
tauri-plugin-shell = { version = "2.0", optional = true }
# Native folder picker for "choose where models/services live".
tauri-plugin-dialog = { version = "2.0", optional = true }
# Native OS notifications so a download/install finishing reaches the user
# even when OAIY Desktop window is hidden to the tray.
tauri-plugin-notification = { version = "2.0", optional = true }
# One OAIY: launching it again shows the running one's window.
tauri-plugin-single-instance = { version = "2", optional = true }
# The desktop's own updates: the release feed, the download and its signature check (minisign,
# against the public key in tauri.conf.json). Only its Rust API is used: no webview is given its
# commands.
tauri-plugin-updater = { version = "2", optional = true }
# The updater plugin's own HTTP client is reqwest 0.13 (the desktop's is 0.12, below): its ClientBuilder is what
# `configure_client` hands over, and the redirect policy for the plugin's reads (https only, few) is made with this one. It adds no
# feature of its own: the client is the plugin's.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, optional = true }
# The engines (language models, media), run by the desktop: std-only, no CUDA to build.
oaiy-studio = { path = "../../../crates/oaiy-studio", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime + HTTP server. axum is the small, focused choice — we
# don't need the heavier alternatives. tower-http gives us the CORS
# layer that lets a hosted oaiy-web at any origin reach OAIY Desktop.
tokio = { version = "1.40", features = ["full"] }
# `ws`: the voice gateway's realtime stream (a phone call's audio).
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
# `oneshot`: the control API's tools call the desktop's own routes in-process,
# through the same router (and so the same gate) as any other caller.
tower = { version = "0.5", default-features = false, features = ["util"] }

# Logging through Tauri's standard mechanism so logs flow into the
# OAIY Desktop's own console + (later) the LogsViewer UI.
log = "0.4"

# Timestamps on log lines + ServiceRuntime.last_status_change so the UI
# can show "started 3m ago" without round-tripping system time across
# the JSON boundary as strings.
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for model downloads. rustls (not native-tls) keeps the
# Windows build self-contained — no schannel ABI surprises and no
# OpenSSL on Linux. `stream` is needed for incremental progress so the
# UI can show "1.2 GB / 4.7 GB · 38 MB/s" instead of a frozen bar.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking", "json"] }
futures-util = "0.3"

# Native python-build-standalone install: gunzip + untar the PBS release
# in-process, so installing Python needs no PowerShell / tar.exe / .ps1.
flate2 = "1"
tar = "0.4"
# Node ships a .zip for Windows (tar.gz elsewhere); deflate-only keeps it small.
zip = { version = "2", default-features = false, features = ["deflate"] }

# UUIDs for download / install job IDs. v4 only — no need for the
# timestamp/MAC variants.
uuid = { version = "1", features = ["v4"] }

# URL parsing for the HuggingFace `huggingface.co/<repo>/blob/...`
# → `/resolve/...` rewrite so users can paste either flavour.
url = "2"
percent-encoding = "2"

# Cross-platform free-disk-space query, for the pre-download space check
# (refuse a 40 GB model before filling the drive) + the "X free" readout
# in the Models tab.
fs2 = "0.4"

# Companion-app device trust: an Ed25519 endpoint identity the mobile app
# verifies, and the base64url + OS randomness its wire format needs. Versions
# pinned to match FormLogic Desktop's implementation, because the two sign and
# verify the SAME payloads — a different curve or encoding would produce
# signatures the mobile app rejects.
ed25519-dalek = { version = "2", features = ["signature"] }
# The pairing offer is shown as a QR so the operator can point a phone at it
# rather than retyping a 700-byte payload. SVG only — no image encoder, and no
# default features, because this renders into a string the UI inlines.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
getrandom = "0.2"

# The end-to-end envelope a provider's web app seals chat with. NaCl `crypto_box`
# — X25519 ECDH → HSalsa20 → XSalsa20-Poly1305 — which is exactly what the
# browser's tweetnacl `box` computes, so the two interoperate byte for byte.
# Notably NOT XChaCha20: the two are easy to conflate and would never open each
# other's frames. `salsa20` without the default `getrandom` feature, because
# every key and nonce here is either derived or counter-based, and the crate's
# curve25519-dalek unifies with the one ed25519-dalek already pulls in.
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }

# Which version is newer (pre-releases ordered as semver orders them): the rule an update is
# offered by, both binaries. The updater plugin compares with the same crate.
semver = "1"

# The signature an update is checked against (minisign, the format the release is signed in).
# The updater plugin checks a download with it; `update::verify` checks it again, with the same
# key, before a download is ever offered to install.
minisign-verify = "0.2"

# Content verification for model downloads. HuggingFace serves the file's
# git-lfs OID — which IS its SHA-256 — in `X-Linked-ETag`, so the overwhelming
# majority of downloads can be verified with nothing asked of the user.
sha2 = "0.10"

# The access model's auth core (src/auth): every secret is compared in constant time (`subtle`),
# and the CSRF value of a cookie session is an HMAC-SHA256 of its token's secret (`hmac`).
# `subtle` (2.6.1) was already in the lock, under `crypto_box` and the `digest` crates; this is a new
# edge to it and no new package. `hmac` (0.12.1) is the one new package this adds to Cargo.lock: the
# RustCrypto crate for the job, depending only on `digest` 0.10, which `sha2` 0.10 already brings, so no
# other crate is added with it. A hand-written HMAC would be worse than the audited one.
subtle = "2"
hmac = "0.12"

# The receptionist's check that a caller asked for a person (`ring/phrases.rs`): a few
# patterns over what they said. Already in the tree (through reqwest and tauri).
regex = "1"

# The web login (feature `web`, src/auth/{password,policy,console}.rs). `argon2` is RustCrypto's
# (0.5, password-hash 0.5, `digest` 0.10 like `sha2` above): Argon2id, PHC strings. The password is
# Unicode NFKC-normalised before it is hashed or judged, `zxcvbn` estimates how guessable it is, and
# the console reads a password from the terminal without echoing it.
argon2 = { version = "0.5", optional = true }
unicode-normalization = { version = "0.1", optional = true }
zxcvbn = { version = "3", optional = true }
rpassword = { version = "7", optional = true }

# The backup file (`backup/`): a ZIP encrypted as a whole in the standard age file format
# (https://age-encryption.org/v1), passphrase mode, so any age implementation opens it and
# nothing here is home-made cryptography. No default features: no armor, no ssh keys, no plugins.
age = { version = "0.11", default-features = false }
# The same scrypt age uses, named here to time it: a backup is written at a work factor chosen here (see backup/container.rs).
scrypt = { version = "0.11", default-features = false }
# Already in the tree (crypto_box, ed25519-dalek). The passphrase of a backup is wiped from memory when the command that was given it is
# done with it, and what holds a password of the web login (feature `web`) is wiped when it is dropped: one dependency, always built.
zeroize = "1"

# Windows-only: the job object that kills child processes when this process
# dies, however it dies. Already in the tree transitively (tauri, tokio); named
# here because a crate cannot `use` an undeclared transitive dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    # Whether the workstation is locked (ring/presence.rs).
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    # How long ago the owner last used the computer (ring/presence.rs).
    "Win32_UI_Input_KeyboardAndMouse",
] }

# An unoptimised Argon2 at 64 MiB and three passes takes seconds, and the estimate of a password
# scans dictionaries: the tests that hash and judge would each wait for them. Only these crates are
# optimised in the test profile; the crate's own code keeps its debug build.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.zxcvbn]
opt-level = 3

[dev-dependencies]
# The tests of the updater's redirect policy build a reqwest 0.13 client, which needs the TLS provider the updater plugin installs for
# itself when it runs; the tests install the same one (already in the tree: the plugin's own).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# The tests encrypt and decrypt backups with age's default scrypt cost (about a second
# when optimised), which is tens of seconds unoptimised: keep the hot crates optimised in
# the dev and test profiles.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
