# Release: tag a version, get everything built and attached to one GitHub Release.
#
#   git tag 0.0.1 && git push origin 0.0.1        (a leading "v" works too)
#
# What lands on the release for that tag:
#
#   oaiy-web-<v>.zip / .tar.gz               the compiled static site — landing page at /,
#                                            the flow builder at /app.html, the desktop page at
#                                            /desktop.html, hashed assets, fonts, _headers.
#                                            Unzip onto any static host and it works.
#   oaiy-desktop-<v>-windows-x64-setup.exe   OAIY Desktop, NSIS installer
#   oaiy-desktop-<v>-windows-x64.msi         OAIY Desktop, MSI installer
#   oaiy-desktop-<v>-linux-x86_64.AppImage   OAIY Desktop, portable
#   oaiy-desktop-<v>-linux-amd64.deb         OAIY Desktop, Debian/Ubuntu
#   oaiy-desktop-<v>-linux-x86_64.rpm        OAIY Desktop, Fedora/RHEL
#   oaiy-server-<v>-linux-x86_64.tar.gz      the headless server (no GUI, no GTK) for Linux hosts
#   oaiy-server-<v>-windows-x64.zip          the headless server for Windows
#   SHA256SUMS.txt
#
# The tag is the version. It is stamped into desktop/src-tauri/tauri.conf.json
# and Cargo.toml at build time (never committed), so the installers, the app's
# About box and the file names all agree with the tag without a release commit.
#
# The web build is made with VITE_API_BASE unset: a fully standalone site with
# sharing off. To ship a build wired to a backend, set that variable in this
# repository's Actions variables (Settings -> Secrets and variables -> Actions
# -> Variables) and it is picked up below.
#
# Verification (ecosystem review OAI-01 / ECO-01): every artifact is built
# from ONE resolved revision, and publication depends on the reusable CI gate
# (ci.yml via workflow_call) having passed AT THAT REVISION — the web suite,
# the complete CLI test script and typecheck, the desktop Vitest suite and the
# native Rust tests in both the headless and GUI configurations. A manual
# dispatch cannot substitute an older green run: the gate runs fresh, on the
# commit that is built. Each artifact ships with release-evidence.json naming
# the revision, target, features, toolchain, artifact digests and the smoke
# results, and the release job refuses to publish evidence for any other
# revision than the one it verified.

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.0.1). Builds and uploads artifacts only; no release is created.'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------- version
  meta:
    name: Resolve version and revision
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
      revision: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The ONE revision every job below builds and verifies.
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            raw="${GITHUB_REF#refs/tags/}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            raw="${{ github.event.inputs.version }}"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$raw' is not a version of the form 0.0.1"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  # ---------------------------------------------------------------- verification
  # The reusable gate, at the exact revision resolved above (OAI-01).
  verify:
    name: Verify the release revision
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.meta.outputs.revision }}

  # ---------------------------------------------------------------- web site
  web:
    name: Web site (landing + app)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Test
        working-directory: ui
        run: npm test

      - name: Build
        working-directory: ui
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          out="$PWD/release"; mkdir -p "$out"
          cat > ui/dist/HOSTING.md <<EOF
          # OAIY web site $VERSION

          This folder is the complete static site: the landing page (index.html),
          the flow builder (app.html) and the desktop-app page (desktop.html), with
          their assets. Upload it as-is to any static host — S3, Netlify, Cloudflare
          Pages, nginx, Apache. No server-side rendering, no rewrite rules needed.

          _headers is read by Netlify and Cloudflare Pages; it sets the strict
          Content-Security-Policy for the package-compiler sandbox worker. Other hosts
          should apply the equivalent header to /assets/compiler-sandbox-worker-*.js
          (see the comments inside the file).

          Built with VITE_API_BASE="${VITE_API_BASE:-}". Empty means standalone: no
          sharing backend, everything runs in the browser.
          EOF
          (cd ui/dist && zip -qr "$out/oaiy-web-$VERSION.zip" .)
          tar -C ui/dist -czf "$out/oaiy-web-$VERSION.tar.gz" .
          ls -l "$out"

      - name: Release evidence (web)
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          REVISION: ${{ needs.meta.outputs.revision }}
        run: |
          node -e '
            const fs = require("fs"); const crypto = require("crypto"); const path = require("path");
            const files = fs.readdirSync("release").map(name => ({ name, sha256: crypto.createHash("sha256").update(fs.readFileSync(path.join("release", name))).digest("hex") }));
            fs.writeFileSync("release/release-evidence-web.json", JSON.stringify({
              component: "web", version: process.env.VERSION, revision: process.env.REVISION,
              target: "static-site", features: [], toolchain: { node: process.version },
              tests: { web: "npm test (ui)", verification: "ci.yml@" + process.env.REVISION },
              // The gate above ran `npm audit --audit-level=high` for ui, cli and desktop at this
              // revision; publication depends on it, so a published artifact set implies PASS.
              dependencyAudit: { status: "pass", tool: "npm audit --audit-level=high (ci.yml)", revision: process.env.REVISION },
              artifacts: files, builtAt: new Date().toISOString(),
            }, null, 2) + "\n");
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: release/*
          if-no-files-found: error

  # ---------------------------------------------------------------- desktop
  desktop:
    name: Desktop (${{ matrix.label }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.revision }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pinned to a revision of the `stable` branch, upgraded deliberately.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned revision)

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf build-essential curl wget file libssl-dev

      - name: Stamp the version from the tag
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          node -e '
            const fs = require("fs"); const v = process.argv[1];
            const conf = "desktop/src-tauri/tauri.conf.json";
            const j = JSON.parse(fs.readFileSync(conf, "utf8")); j.version = v;
            fs.writeFileSync(conf, JSON.stringify(j, null, 2) + "\n");
            const toml = "desktop/src-tauri/Cargo.toml";
            fs.writeFileSync(toml, fs.readFileSync(toml, "utf8").replace(/^version = "[^"]+"/m, `version = "${v}"`));
            console.log("stamped", v);
          ' "$VERSION"

      # The desktop bundles the headless CLI (scripts/sync-cli.mjs copies its
      # esbuild output into src-tauri/resources), so the CLI has to exist first.
      - name: Install and build the CLI
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Check CLI HTTPS shutdown
        working-directory: cli
        run: node test/cli-http-exit.mjs

      - name: Install the desktop app's dependencies
        working-directory: desktop
        run: npm ci

      - name: Build OAIY Desktop
        working-directory: desktop
        run: npm run tauri:build

      - name: Build the headless server
        working-directory: desktop/src-tauri
        run: cargo build --release --no-default-features --bin oaiy-server

      - name: Stage complete headless distribution
        shell: bash
        run: |
          server=desktop/src-tauri/target/release/oaiy-server
          [[ "$RUNNER_OS" == "Windows" ]] && server="$server.exe"
          node desktop/scripts/package-server.mjs "$server" headless-dist

      - name: Execute a flow from the headless distribution
        run: node desktop/scripts/smoke-server.mjs headless-dist

      - name: Collect
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          out="$PWD/release"; mkdir -p "$out"
          bundle="desktop/src-tauri/target/release/bundle"
          find "$bundle" -type f | sort
          if [[ "$LABEL" == "windows" ]]; then
            cp "$(find "$bundle" -type f -name '*-setup.exe' | head -1)" "$out/oaiy-desktop-$VERSION-windows-x64-setup.exe"
            cp "$(find "$bundle" -type f -name '*.msi' | head -1)"       "$out/oaiy-desktop-$VERSION-windows-x64.msi"
            ( cd headless-dist && 7z a -bd "$out/oaiy-server-$VERSION-windows-x64.zip" . >/dev/null )
          else
            cp "$(find "$bundle" -type f -name '*.AppImage' | head -1)" "$out/oaiy-desktop-$VERSION-linux-x86_64.AppImage"
            cp "$(find "$bundle" -type f -name '*.deb' | head -1)"      "$out/oaiy-desktop-$VERSION-linux-amd64.deb"
            rpm="$(find "$bundle" -type f -name '*.rpm' | head -1 || true)"
            [[ -n "$rpm" ]] && cp "$rpm" "$out/oaiy-desktop-$VERSION-linux-x86_64.rpm"
            tar -C headless-dist -czf "$out/oaiy-server-$VERSION-linux-x86_64.tar.gz" .
          fi
          ls -l "$out"

      # The final ARCHIVE (not the developer tree) starts with an empty profile,
      # no system Node/npm on PATH and no checkout paths: smoke-server.mjs
      # builds that environment itself.
      - name: Verify the extracted headless release (fresh profile)
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir headless-verified
          if [[ "$LABEL" == "windows" ]]; then
            7z x -bd "release/oaiy-server-$VERSION-windows-x64.zip" -oheadless-verified >/dev/null
          else
            tar -C headless-verified -xzf "release/oaiy-server-$VERSION-linux-x86_64.tar.gz"
          fi
          node desktop/scripts/smoke-server.mjs headless-verified

      # Source revision, target, features, toolchain, artifact digests and the
      # tests that ran, recorded TOGETHER per artifact set (OAI-01).
      - name: Release evidence (${{ matrix.label }})
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          REVISION: ${{ needs.meta.outputs.revision }}
          LABEL: ${{ matrix.label }}
        run: |
          RUSTC="$(rustc --version)"; CARGO="$(cargo --version)"; NODE="$(node --version)"
          node -e '
            const fs = require("fs"); const crypto = require("crypto"); const path = require("path");
            const files = fs.readdirSync("release").map(name => ({ name, sha256: crypto.createHash("sha256").update(fs.readFileSync(path.join("release", name))).digest("hex") }));
            fs.writeFileSync(`release/release-evidence-${process.env.LABEL}.json`, JSON.stringify({
              component: "desktop+headless", version: process.env.VERSION, revision: process.env.REVISION,
              target: process.env.LABEL, runner: process.env.RUNNER_OS,
              features: { desktop: ["gui"], headless: ["--no-default-features"] },
              toolchain: { rustc: process.argv[1], cargo: process.argv[2], node: process.env.NODE },
              dependencyAudit: { status: "pass", tool: "npm audit --audit-level=high (ci.yml: ui, cli, desktop)", revision: process.env.REVISION },
              tests: {
                verification: "ci.yml@" + process.env.REVISION + " (web, cli npm test + typecheck, desktop vitest, cargo test headless + gui, npm audit high)",
                cliHttpsShutdown: "node test/cli-http-exit.mjs", stagedHeadlessSmoke: "smoke-server.mjs headless-dist",
                extractedHeadlessSmoke: "smoke-server.mjs headless-verified (fresh profile, no system Node)",
              },
              artifacts: files, builtAt: new Date().toISOString(),
            }, null, 2) + "\n");
          ' "$RUSTC" "$CARGO"
          cat "release/release-evidence-$LABEL.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  # ---------------------------------------------------------------- release
  release:
    name: Publish release
    # Publication needs the verification gate AND every build, all at the
    # same resolved revision (OAI-01): a failing test in any lane blocks it.
    needs: [meta, verify, web, desktop]
    if: needs.meta.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      # Every evidence file must name the revision this workflow verified.
      - name: Check release evidence names the verified revision
        working-directory: artifacts
        env:
          REVISION: ${{ needs.meta.outputs.revision }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" == "$TAG_SHA" ]] || { echo "::error::verified revision $REVISION differs from the tagged commit $TAG_SHA"; exit 1; }
          count=0
          for f in release-evidence-*.json; do
            rev="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).revision)' "$f")"
            [[ "$rev" == "$REVISION" ]] || { echo "::error::$f records revision $rev, expected $REVISION"; exit 1; }
            count=$((count+1))
          done
          [[ "$count" -ge 3 ]] || { echo "::error::expected evidence for web, linux and windows; found $count"; exit 1; }
          echo "release evidence verified for $REVISION ($count files)"

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## What is in this release

          **Web site** — \`oaiy-web-$VERSION.zip\` (or \`.tar.gz\`) is the compiled static site:
          the landing page at \`/\`, the flow builder at \`/app.html\` and the desktop-app page at
          \`/desktop.html\`. Unzip it onto any static host. \`HOSTING.md\` inside explains the one
          header worth setting.

          **OAIY Desktop** — the tray app that manages local model servers, downloads, Python and
          the browser sidecar for the web app.
          - Windows: \`oaiy-desktop-$VERSION-windows-x64-setup.exe\` (installer) or the \`.msi\`
          - Linux: \`.AppImage\` (portable), \`.deb\` (Debian/Ubuntu) or \`.rpm\` (Fedora/RHEL)

          **oaiy-server** — the same local API with no window, tray or GTK, for a Linux or
          Windows host that the CLI or a hosted web app drives. See \`desktop/README.md\`.

          \`SHA256SUMS.txt\` covers every file above. \`release-evidence-*.json\` records, per
          artifact set, the source revision, target, features, toolchain, digests and the tests
          that ran before publication.
          EOF

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OAIY ${{ needs.meta.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
