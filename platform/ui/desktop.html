<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Safe baseline CSP: blocks plugin (<object>/<embed>) + <base href> injection,
         zero risk. Full script-src lockdown needs the inline theme script externalized
         + live testing (engine needs 'unsafe-eval'; flows hit arbitrary endpoints). -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7167ff" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f0e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a12" />

    <title>OAIY Desktop — the agent, flows, models and phone receptionist on your computer</title>
    <meta
      name="description"
      content="OAIY Desktop puts the Agent, the flow editor, OAIY’s own models and an AI receptionist for your business phone on your Windows or Linux computer (Linux is newer and less tested). Install steps, plugins, the headless server and a library of services."
    />
    <link rel="canonical" href="https://oaiy.com/desktop.html" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OAIY" />
    <meta property="og:url" content="https://oaiy.com/desktop.html" />
    <meta property="og:title" content="OAIY Desktop" />
    <meta property="og:description" content="The Agent, the flow editor, OAIY’s own models and an AI receptionist for your phone line, on Windows and Linux (Linux is newer, less tested)." />
    <meta property="og:image" content="https://oaiy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OAIY: Less prompting. More possibilities. The Agent in OAIY Desktop, beside the OAIY mark." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OAIY Desktop" />
    <meta name="twitter:description" content="The Agent, the flow editor, OAIY’s own models and an AI receptionist for your phone line, on Windows and Linux (Linux is newer, less tested)." />
    <meta name="twitter:image" content="https://oaiy.com/og-image.png" />
    <meta name="twitter:image:alt" content="OAIY: Less prompting. More possibilities. The Agent in OAIY Desktop, beside the OAIY mark." />

    <!-- Pre-paint theme so the page never flashes the wrong colours. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('oaiy_theme');
          var resolved =
            t === 'dark' ? 'dark'
            : t === 'light' ? 'light'
            : t === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
              : 'dark';
          var r = document.documentElement;
          r.classList.remove('light', 'dark');
          r.classList.add(resolved);
          r.style.colorScheme = resolved;
        } catch (e) { /* localStorage blocked — fall back to the class on <html> */ }
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/desktop-main.tsx"></script>
  </body>
</html>
