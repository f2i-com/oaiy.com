<!doctype html>
<html lang="en" class="dark oaiy-app">
  <head>
    <meta charset="UTF-8" />
    <!-- Safe baseline CSP: blocks plugin (<object>/<embed>) and <base href> injection
         with zero risk to the app. A full script-src lockdown (the bigger XSS win)
         needs the inline pre-paint theme script externalized first + live testing,
         since the engine requires 'unsafe-eval' and flows connect to arbitrary
         user endpoints (so connect-src can't be tightened). -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7167ff" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f0e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a12" />
    <title>OAIY Flows — the flow editor</title>
    <meta name="description" content="The OAIY flow editor: draw flows that chain AI models, tools and media, and run them in your browser with your own AI provider. Your keys stay on this device." />
    <link rel="canonical" href="https://oaiy.com/app.html" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OAIY" />
    <meta property="og:url" content="https://oaiy.com/app.html" />
    <meta property="og:title" content="OAIY Flows" />
    <meta property="og:description" content="Draw flows that chain AI models, tools and media, and run them in your browser with your own AI provider." />
    <meta property="og:image" content="https://oaiy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OAIY: Less prompting. More possibilities. The Agent in OAIY Desktop, beside the OAIY mark." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OAIY Flows" />
    <meta name="twitter:description" content="Draw flows that chain AI models, tools and media, and run them in your browser with your own AI provider." />
    <meta name="twitter:image" content="https://oaiy.com/og-image.png" />
    <meta name="twitter:image:alt" content="OAIY: Less prompting. More possibilities. The Agent in OAIY Desktop, beside the OAIY mark." />

    <!-- Pre-paint theme so the workspace never flashes the wrong colours.
         Mirrors ThemeContext's key + defaults; ThemeContext re-applies on
         mount (idempotent), so this is purely a flash-of-wrong-theme guard. -->
    <script>
      (function () {
        try {
          // In OAIY's window the desktop says the theme (ThemeContext's desktopTheme).
          var d = window.__OAIY_DESKTOP__, kept = null;
          try { kept = sessionStorage.getItem('oaiy-desktop-theme'); } catch (e) { /* storage blocked */ }
          var t = d ? (window.__OAIY_THEME__ || kept || d.theme) : localStorage.getItem('oaiy_theme');
          var resolved =
            t === 'dark' ? 'dark'
            : t === 'light' ? 'light'
            : t === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
              : 'dark';
          var r = document.documentElement;
          r.classList.remove('light', 'dark');
          r.classList.add(resolved);
          if (d) r.classList.add('in-oaiy');
          r.style.colorScheme = resolved;
        } catch (e) { /* localStorage blocked — fall back to the class on <html> */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
